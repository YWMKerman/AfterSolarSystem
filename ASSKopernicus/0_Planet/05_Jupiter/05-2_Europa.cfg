			description = #ASS_Europa_desc // 在过去的数亿年里，这个冰冻的世界与另外三颗伽利略卫星先后进入了共同的轨道共振。它们彼此牵引着，慢慢远离下方那颗巨大的气态行星。随着地质活动逐渐减弱，木卫二不再像过去那样频繁地改写自己的地表，那些沟壑、裂缝与撞击留下的伤痕开始长久地保留下来。如今，它看起来已经没有早期记录中那么平滑了。\n\n远处的太阳已经步入亚巨星阶段，而这个世界的内部却正在慢慢归于沉寂。厚厚的冰层之下是否还藏着熟悉的海洋，我们仍然无法确定。也许沿着那些尚未完全沉寂的裂缝，还能找到一些来自深处的线索...
