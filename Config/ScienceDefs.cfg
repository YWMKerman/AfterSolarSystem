		EuropaFlyingCilff = #ASS_EuropaFlyingcrewReportCilff // 裂隙把冰面分割成大小不一的区域，一些边缘已经破碎。它们保留着冰壳曾经活动过的痕迹，值得挑一处仔细看看。
		EuropaFlyingLake = #ASS_EuropaFlyingcrewReportLake // 下方是一条宽阔的沟壑，起伏的侧壁之间铺着破碎的冰。你沿着它的延伸方向拍照，试着把这片地形接进已有的地图。
		EuropaFlyingRiverValley = #ASS_EuropaFlyingcrewReportRiverValley // 你正沿着一片低洼的沟壑飞行，两侧冰壁上可以辨认出断裂与局部崩落的痕迹。它的形状还不足以说明这里曾经流过液态水。
		EuropaFlyingCilff = #ASS_EuropaFlyingcrewReportCilff // 裂隙把冰面分割成大小不一的区域，一些边缘已经破碎。它们保留着冰壳曾经活动过的痕迹，值得挑一处仔细看看。
		EuropaFlyingLow = #ASS_EuropaFlyingcrewReportLow//你正在寻找着合适的降落点作为目标。
