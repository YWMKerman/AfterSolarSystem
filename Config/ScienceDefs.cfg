@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
	@RESULTS
	{
		SunInSpaceLow = #ASS_SunInSpaceLowcrewReport//你正慢慢的感觉到周围的温度正在迅速上升，强烈的太阳光透过舷窗照进来几乎使得你无法睁开眼睛。 \n于是你佩戴好专用的墨镜朝舷窗外看去，你终于看清了那个一直被高光掩盖的那颗巨大红色发光球体的真面目 - 一个巨大的等离子体，它在不断地翻滚着，膨胀着..... \n 你开始担心飞船那层薄薄的墙壁是否能保护你的安全。
		SunInSpace =    #ASS_SunInSpace//从这个位置看去，太阳是这一片星空中最明亮的恒星，即便你深处数十光年外也能轻松的看见它，它的光芒亮到足以让其它恒星黯然失色。 但是，那只不过是一颗恒星临死前的辉煌罢了，所有的恒星都会经历的。 
		SunFlying = #ASS_SunFlyingcrewReport//飞船上的指示灯正在疯狂闪速，警报声正在急促的警报。 但愿我们的飞船能扛得住如此高的温度。

        MercuryInSpaceLow = #ASS_MercuryInSpaceLowcrewReport//下方的撞击坑、陡崖和岩石平原仍清晰可辨。这个古老世界还保留着自己的面貌，只是越来越强烈的日照正在改变它的热环境。
		MercuryInSpace = #ASS_MercuryInSpace//水星紧挨着耀眼的太阳，显得格外渺小。你记录下这颗行星的轮廓，忽然觉得，在太阳继续膨胀之前多拍几张照片也不错。
		MercurySrfLanded = #ASS_MercurySrfLanded//舷窗外是坚硬的岩面、松散的碎屑和零星的大块岩石。这里安静得令人不安，舱内持续工作的散热系统倒是很有存在感。
		MercurySrfLandedNorthernregion = #ASS_crewReport_Mercury_SrfLanded_Biome005//你隔着舷窗勾画出岩块与阴影的边界，并把它们与轨道照片上的位置对应起来。有些从太空看去像裂缝的暗线，只是岩块投下的影子；这份记录提醒大家，绘制地质图时最好也记得太阳在哪里。
		MercurySrfLandedSouthernregion = #ASS_crewReport_Mercury_SrfLanded_Biome006//舷窗外的岩面与北部看起来同样荒凉。你把本次日照条件和散热负荷记入报告，准备与北半球同类地点比较。仅凭“南部”这个名字，似乎并不能替冷却系统争取到假期。
		MercurySrfLandedNorthernplains = #ASS_crewReport_Mercury_SrfLanded_Biome007//你固定好带滤光片的相机，以地平线上的地标为参照追踪太阳。如果地点和时机合适，跨越近日点附近的一段观测可能记录到太阳先减速、短暂逆行，再恢复原来的运动方向。这里的日晷大概需要附带一本说明书。
		MercurySrfLandedLavaFlow = #ASS_crewReport_Mercury_SrfLanded_Biome001//低角度的阳光斜掠过岩面，坑壁留下了大片阴影。你选取受光处和背阴处分别记录，准备查明这片平原为何比赤道热点凉爽。至少这里的地名终于给了散热工程师一点安慰。

        _VenusInSpaceLow = #ASS_VenusInSpaceLowcrewReport//一个高温的地狱世界，它的表面遍布熔岩，火山，还有巨大的石头。 \n 我可不想到那上面去。
		_VenusInSpace = #ASS_VenusInSpacecreawReport//大气消失后我们已经可以看见曾经看不到的地表的真面目了，只是它现在看起来似乎很恐怖
		_VenusSrfLanded = #ASS_VenusSrfLandedcrewReport//飞船下方的岩石似乎很松软，但幸运的是我们没有陷进去
		_VenusSrfSplashed = #ASS_VenusSrfSplashedcrewReport//我们正着陆在滚烫的熔岩上，高温使得我们飞船内部犹如烤炉一般。
		_VenusSrfLandedPeak = #ASS_VenusSrfLandedcrewReportPeak//这座巨大的山峰似乎并没有被数十亿年的活跃地质运动摧毁。
		_VenusFlying = #ASS_VenusFlyingcrewReport//你正在飞越这颗高温的地狱世界，透过舷窗，你看见了下方的地表遍布着熔岩，火山，还有巨大的石头。 \n 你可不想到那上面去。


        EarthInSpaceLow = #ASS_EarthInSpaceLowcrewReport//
		EarthInSpace = #ASS_EarthInSpacecrewReport//
		EarthFlying = #ASS_EarthFlyingcrewReport//T
		EarthSrfLanded = #ASS_EarthSrfLandedcrewReport//
		EarthSrfSplashed = #ASS_EarthSrfSplashedcrewReport//
		EarthSrfLandedPanguland = #ASS_EarthSrfLandedcrewReportPanguland//
		EarthSrfSplashePanguland = #ASS_EarthSrfSplashedcrewReportPanguland//

        LunaInSpaceLow = #ASS_MoonInSpaceLowcrewReport//你正在月面寻找着什么，并试图寻找着月面上曾经人类遗留下来的登月艇，探测器。
		LunaInSpace = #ASS_MoonInSpace//看着窗外这颗熟悉而陌生的卫星，你想起了数十亿年前一位中国不知名的诗人的诗句“小时不识月，呼作白玉盘”
		LunaSrfLanded = #ASS_MoonSrfLandedcrewReport//We Choose To Go To The Moon！
		LunaSrfLandedMoonSea = #ASS_MoonSrfLandedcrewReportMoonSea//自1969年后的70亿年，我们又再次踏上了这片土地，我们看着熟悉的故土有些悲伤，因为我们再也回不去了。

        MarsInSpaceLow = #ASS_MarsInSpaceLowcreawReport//我们已到达火星低轨道，舷窗外的火星映入眼帘。 你此刻开始放开双手，感受失重。
		MarsInSpaceLow = #ASS_MarsInSpaceLowcreawReport1//这时，你趴在窗户旁，试图寻找火卫一的踪迹。
		MarsInSpace = #ASS_MarsInSpace//透过舷窗，你试图开始寻找火星的两个卫星 火卫一，火卫二的踪迹
		MarsFlying = #ASS_MarsFlyingcrewReport//你观察到了下方的世界中的一场沙尘暴。
		MarsFlyingCanyonsailor = #ASS_MarsFlyingcrewReportCanyonsailor//看，水手峡谷！
		MarsSrfLanded = #ASS_MarsSrfLandedcrewReport//我们到家了~
		MarsSrfLandedCanyonsailor = #ASS_MarsSrfLandedcrewReportCanyonsailor//你透过舷窗，看见窗外那宽阔的峡谷，你感到无比的震撼。
		MarsSrfSplashed = #ASS_MarsSrfSplashedcrewReport//你看到舷窗外的海浪拍打在飞船的外壁，我们或许应该在飞船里等待救援的到来？ 但在此之前也许我们可以先出去游泳？
		MarsSrfLandedLaunchpad = #autoLOC_501259 //#autoLOC_501259 = We don't seem to be moving very fast right now.
		MarsSrfLandedRunway = #autoLOC_501260 //#autoLOC_501260 = Reporting in at the Runway. Good thing there's not a lot of air traffic, because I don't think we ever got clearance from the tower to be here.
		MarsSrfLandedKSC = #autoLOC_501261 //#autoLOC_501261 = This is our Space Center. We're home.
		MarsFlyingOlympus = #ASS_MarsFlyingcrewReportOlympus//你从奥林匹斯山旁飞过，透过舷窗，你看见了它是多么的巨大，它看起来比大气层还高。
		MarsSrfLandedOlympus = #ASS_MarsSrfLandedcrewReportOlympus//你着陆在奥林匹斯山的较高处，这时候你发现你所处的海拔非常高了，窗外的天空已经不在呈现出蓝色，而是深蓝色。
		MarsFlyingSwamp_ = #ASS_MarsFlyingcrewReportSwamp_//你正在飞跃沼泽的上空，你注意到下方的有着大量的植被，如果你试图寻找着陆地点，请小心。
		MarsSrfLandedSwamp_ = #ASS_MarsSrfLandcrewReportSwamp_//下方的土地似乎非常松软，飞船的着陆在地上留下了一个明显的印记。
		MarsSrfSplashedSwamp_ = #ASS_MarsSrfSokashedSwamp_//你的飞船着陆在沼泽的泥地里，溅起的你把将飞船涂抹的看起来非常肮脏。
		MarsFlyingTaerxisiHeightland = #ASS_MarsFlyingcrewReportTaerxisiHeightland//下方的高原显得很死寂，没有植被，没有土壤，只有漫天飞舞的黄沙
		MarsSrfLandedTaerxisiHeightland = #ASS_MarsSrfLandedcrewReportTaerxisiHeightland//你注意到这里的气温有些炎热，你感觉有些缺水。
		MarsFlyingMoran_Sea = #ASS_MarsFlyingcrewReportMoran_Sea//窗外你看见了熟悉的地貌，你一眼就认出你在家附近了
		MarsSrfLandedMoran_Sea = #ASS_MarsSrfLandedcrewReportMoran_Sea//我们的家在哪里。
		MarsSrfSplashedMoran_Sea = #ASS_MarsSrfSplashedcrewReportMoran_Sea//是时候等待救援队到来了。
		MarsFlyinghills = #ASS_MarsFlyingcrewReporthills//在你注意到，飞船外面是茫茫的大戈壁滩，有着大量的仙人掌
		MarsSrfLandedhills = #ASS_MarsFlyingcrewReporthills//我觉得我们该回飞船里了，炎热的沙漠可能会导致我们脱水，我们应该回飞船里等待搜救队。
		MarsFlyingOlympusProMax = #ASS_MarsFlyingcrewReportOlympusProMax//我们的载具似乎无法获取足够的升力前往山顶
		MarsSrfLandedOlympusProMax = #ASS_MarsSrfLandedcrewReportOlympusProMax//当你处于山顶，你才发现这座山是如此的巨大。

        PhobosInSpaceLow = #ASS_PhobopsInSpaceLowcreawReport//仔细的看，它的表面遍布了许多裂痕，以及陨石坑，它的体积是多么的小。
