		EuropaFlyingCraters = #ASS_EuropaFlyingcrewReportCraters // 陨石坑的边缘和周围散布的碎块逐渐清晰起来。你绕过陡峭的坑壁，记录哪些地形最适合安全着陆与采样。
		EuropaSrfLanded = #ASS_EuropaSrfLandedcrewReports // 着陆器停在坚硬而起伏的冰面上。裂纹与碎冰让这里比旧照片中显得更粗糙，找到一块平整的停车位并不容易。
