@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:FOR[AfterSolarSystem]
{
	@RESULTS
	{
		// _Venus
		_VenusSrfLanded = #ASS_atmosphereAnalysis__Venus_SrfLanded
		_VenusFlyingLow = #ASS_atmosphereAnalysis__Venus_FlyingLow
		_VenusFlyingHigh = #ASS_atmosphereAnalysis__Venus_FlyingHigh
		_VenusSrfLandedPeak = #ASS_atmosphereAnalysis__Venus_SrfLanded_Biome007
		_VenusFlyingLowLavaFlow = #ASS_atmosphereAnalysis__Venus_FlyingLow_Biome002
		// Earth
		EarthSrfLanded = #ASS_atmosphereAnalysis_Earth_SrfLanded
		EarthFlyingLow = #ASS_atmosphereAnalysis_Earth_FlyingLow
		EarthFlyingHigh = #ASS_atmosphereAnalysis_Earth_FlyingHigh
		EarthSrfLandedPanguland = #ASS_atmosphereAnalysis_Earth_SrfLanded_Biome002
		EarthFlyingLowLavaFlow = #ASS_atmosphereAnalysis_Earth_FlyingLow_Biome001
		// Mars
		MarsSrfLanded = #ASS_atmosphereAnalysis_Mars_SrfLanded
		MarsFlyingLow = #ASS_atmosphereAnalysis_Mars_FlyingLow
		MarsFlyingHigh = #ASS_atmosphereAnalysis_Mars_FlyingHigh
		MarsSrfLandedOlympus = #ASS_atmosphereAnalysis_Mars_SrfLanded_Biome001
		MarsSrfLandedCanyonsailor = #ASS_atmosphereAnalysis_Mars_SrfLanded_Biome005
		MarsSrfLandedSwamp_ = #ASS_atmosphereAnalysis_Mars_SrfLanded_Biome027
		MarsFlyingLowTaerxisiHeightland = #ASS_atmosphereAnalysis_Mars_FlyingLow_Biome010
		// Jupiter
		JupiterFlyingLow = #ASS_atmosphereAnalysis_Jupiter_FlyingLow//样本仍以氢为主，另有少量氦；水和氨的信号需要结合采样高度与温度一起分析。你为不同云层留下各自的记录。木星换了云的模样，却依然保留着氢氦大气的底子。
		JupiterFlyingHigh = #ASS_atmosphereAnalysis_Jupiter_FlyingHigh
		JupiterFlyingLowEZ = #ASS_atmosphereAnalysis_Jupiter_FlyingLow_Biome001//你沿赤道带采集气体，并将氢氦背景中的水蒸气信号与采样时的温度、压力一起保存。浅色云层正在改变这里的外观，但水在气相和云颗粒之间如何分配，还需要比较云内外的样本。
		JupiterFlyingLowWaterCloudsBands = #ASS_atmosphereAnalysis_Jupiter_FlyingLow_WaterCloudsBands//分析仪检出了水的信号，你同时保存采样高度、温度与压力，以追踪水在蒸气和云颗粒之间的分布。这些数据将与云图对照，研究水云逐渐取代旧氨云的过程。承载这些云的气体仍主要是氢和氦。
		JupiterFlyingHighWaterCloudsBands = #ASS_atmosphereAnalysis_Jupiter_FlyingHigh_WaterCloudsBands//水云带在下方显得格外明亮，采样口收集的却是这里稀薄的高层气体，仍以氢和氦为主。你延长采样时间，准备把微量水的检测结果与较低高度的记录比较，确定水云之上的气体分布。
		JupiterFlyingLowPR = #ASS_atmosphereAnalysis_Jupiter_FlyingLow_PR//极区的样本中仍能检出氨。你将这些测量与旧资料中可比高度的记录、如今缩小的氨云范围放在一起，研究参与成云的氨为何越来越少。报告中特意区分了气态氨与凝结态氨，云层消退并不意味着整颗木星失去了氨。
		// Europa
		EuropaSrfLanded = #ASS_atmosphereAnalysis_Europa_SrfLanded
		EuropaFlyingLow = #ASS_atmosphereAnalysis_Europa_FlyingLow // 仪器花了很久才收集到足够的样本，结果仍是以氧气为主的稀薄气体。你把采样位置与下方沟壑的分布一同记录，准备比较不同区域的结果。
		EuropaFlyingHigh = #ASS_atmosphereAnalysis_Europa_FlyingHigh
		EuropaSrfLandedCilff = #ASS_atmosphereAnalysis_Europa_SrfLanded_Biome006
		EuropaSrfLandedLowlands = #ASS_atmosphereAnalysis_Europa_SrfLanded_Biome002
		// Ganymede
		GanymedeSrfLanded = #ASS_atmosphereAnalysis_Ganymede_SrfLanded
		GanymedeFlyingLow = #ASS_atmosphereAnalysis_Ganymede_FlyingLow
		GanymedeFlyingHigh = #ASS_atmosphereAnalysis_Ganymede_FlyingHigh
		GanymedeSrfLandedSwamp = #ASS_atmosphereAnalysis_Ganymede_SrfLanded_Biome001
		GanymedeFlyingLowYunJikeng = #ASS_atmosphereAnalysis_Ganymede_FlyingLow_Biome003
		// Callisto
		CallistoSrfLanded = #ASS_atmosphereAnalysis_Callisto_SrfLanded
		CallistoFlyingLow = #ASS_atmosphereAnalysis_Callisto_FlyingLow
		CallistoFlyingHigh = #ASS_atmosphereAnalysis_Callisto_FlyingHigh
		CallistoSrfLandedHighlands = #ASS_atmosphereAnalysis_Callisto_SrfLanded_Biome004
		CallistoSrfLandedHSD = #ASS_atmosphereAnalysis_Callisto_SrfLanded_Biome005
		// Saturn
		SaturnFlyingLow = #ASS_atmosphereAnalysis_Saturn_FlyingLow//氢占据样本的绝大部分，其后是氦和少量甲烷，另可检出微量氨。你将氨的信号与采样温度、压力及云层位置对照，研究这里的氨云。云层的橘黄色外观，并不意味着氨本身就是橘色的。
		SaturnFlyingHigh = #ASS_atmosphereAnalysis_Saturn_FlyingHigh//稀薄样本中的主要成分仍是氢和氦，并能检出甲烷。你延长采样时间，准备将高层的微量成分与下方氨云附近的样本比较，追踪气体在不同高度之间的分布。
		SaturnFlyingLowEB = #ASS_atmosphereAnalysis_Saturn_FlyingLow_Biome003//赤道带的样本中，氢、氦和少量甲烷仍构成主要背景，微量氨的记录则与云层位置一同保存。你准备比较云内外的样本，判断氨在气相与凝结物之间如何分配。这里依然属于氨云覆盖的天空。
		SaturnFlyingLowNorthPolar = #ASS_atmosphereAnalysis_Saturn_FlyingLow_NorthPolar//北极样本仍以氢和氦为主，并带有少量甲烷和微量氨。你标注采样点相对六角形急流边界的位置，准备比较边界内外的成分差异。急流能影响气体与云颗粒的输送，那六条边并不是固体围墙。
		SaturnFlyingLowSouthPolar = #ASS_atmosphereAnalysis_Saturn_FlyingLow_SouthPolar//南极样本保留着氢氦大气的特征，另有少量甲烷，并能检出微量氨。你将数据按压力层归档，准备与北极的样本比较，研究不同环流如何输送这些成分。氨云可以在这里存在，橘色薄雾却还需要结合颗粒观测来解释。
		// Titan
		TitanSrfLanded = #ASS_atmosphereAnalysis_Titan_SrfLanded//这层稠密的大气主要由氮气组成，另有明显的甲烷和少量乙烷。压力看起来并不陌生，但组成与低温告诉我们，这里仍不是能直接呼吸的世界。
		TitanSrfLandedCoolWater = #ASS_atmosphereAnalysis_Titan_SrfLanded_Biome001//湖床上方的气体仍以氮气为主，并可检出甲烷和少量乙烷。你将它与盆地外的对照样本一起保存，准备检查沉积物是否对局部气体组成有所影响。仅仅测到甲烷，还不能证明这里仍有液体流淌。
		TitanFlyingLow = #ASS_atmosphereAnalysis_Titan_FlyingLow//氮气携带着甲烷与乙烷进入采样室，仪器记录下这份寒冷的混合物。我们已经不必依靠那层朦胧的外观，来猜测这里的天空由什么构成了。
		TitanFlyingHigh = #ASS_atmosphereAnalysis_Titan_FlyingHigh//高处的空气比地面附近稀薄得多，也更加寒冷。样本依然以氮气为主，甲烷与乙烷的信号说明我们还没有完全离开这颗卫星的大气。
		TitanSrfLandedLowlands = #ASS_atmosphereAnalysis_Titan_SrfLanded_Biome003//你在低地取得一份稠密而寒冷的氮气样本，甲烷与乙烷的信号清晰可辨。仪器给这片朦胧天空留下了一份比照片更具体的记录。
		TitanSrfLandedSoutherndelta = #ASS_atmosphereAnalysis_Titan_SrfLanded_Biome008//你将三角洲附近的气体与远处高地的样本分开保存。甲烷和乙烷仍然存在，但地形的名字本身不足以说明这里此刻流淌着什么。
		// Uranus
		UranusFlyingLow = #ASS_atmosphereAnalysis_Uranus_FlyingLow
		UranusFlyingHigh = #ASS_atmosphereAnalysis_Uranus_FlyingHigh
		UranusFlyingLowEye = #ASS_atmosphereAnalysis_Uranus_FlyingLow_Biome004
		// Neptune
		NeptuneFlyingLow = #ASS_atmosphereAnalysis_Neptune_FlyingLow
		NeptuneFlyingHigh = #ASS_atmosphereAnalysis_Neptune_FlyingHigh
		NeptuneFlyingLowImpontiStormEye = #ASS_atmosphereAnalysis_Neptune_FlyingLow_Biome001
		NeptuneFlyingLowWC = #ASS_atmosphereAnalysis_Neptune_FlyingLow_Biome004
		// Reachable only when DeeptoIceGiant=True
		NeptuneSrfLanded = #ASS_atmosphereAnalysis_Neptune_SrfLanded
		// Triton
		TritonSrfLanded = #ASS_atmosphereAnalysis_Triton_SrfLanded
		TritonFlyingLow = #ASS_atmosphereAnalysis_Triton_FlyingLow
		TritonFlyingHigh = #ASS_atmosphereAnalysis_Triton_FlyingHigh
		TritonSrfLandedHightLands = #ASS_atmosphereAnalysis_Triton_SrfLanded_Biome005
		// PlanetNine
		PlanetNineFlyingLow = #ASS_atmosphereAnalysis_PlanetNine_FlyingLow
		PlanetNineFlyingHigh = #ASS_atmosphereAnalysis_PlanetNine_FlyingHigh
		PlanetNineFlyingLowBC = #ASS_atmosphereAnalysis_PlanetNine_FlyingLow_Biome003
		// Pluto
		PlutoSrfLanded = #ASS_atmosphereAnalysis_Pluto_SrfLanded
		PlutoFlyingLow = #ASS_atmosphereAnalysis_Pluto_FlyingLow
		PlutoFlyingHigh = #ASS_atmosphereAnalysis_Pluto_FlyingHigh
		PlutoSrfLandedTombaughRegio = #ASS_atmosphereAnalysis_Pluto_SrfLanded_Biome013
		// Muna
		MunaSrfLanded = #ASS_atmosphereAnalysis_Muna_SrfLanded
		MunaFlyingLow = #ASS_atmosphereAnalysis_Muna_FlyingLow
		MunaFlyingHigh = #ASS_atmosphereAnalysis_Muna_FlyingHigh
		MunaSrfLandedNorthernIceCap = #ASS_atmosphereAnalysis_Muna_SrfLanded_Biome006
		MunaSrfLandedYuanqian = #ASS_atmosphereAnalysis_Muna_SrfLanded_Biome002
		// Sun
