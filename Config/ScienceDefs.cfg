// Triton: sparse liquid-nitrogen lakes within predominantly frozen terrain.

@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[AfterSolarSystem]
{
	@RESULTS
	{
		TritonInSpaceLow = #ASS_TritonInSpaceLowcrawReport // 大片冰原占据了下方的视野，少数凹地中才有液面反光。你逐一标记这些分散的液氮湖，准备寻找几处彼此接近、适合连续考察的湖泊。
		TritonInSpace = #ASS_TritonInSpacecrewReport // 海卫一的大部分表面仍是一片冰冻的世界，平滑区域与起伏地形交错分布。那些少量的液氮湖在这个距离很难辨认，你决定先完成整幅地形的测绘。
		TritonFlying = #ASS_TritonFlyingcrewReport // 稀薄的大气仍在影响飞船的航迹。你透过舷窗寻找冰原中的低洼处，将疑似湖面的反光与固定的亮色冰斑分开标记。
		TritonSrfSplashed = #ASS_TritonSrfSplashedcrewReport // 飞船停在一处液氮湖中，舷窗外的湖岸与大片坚硬冰原清楚可见。你记录船体的晃动和接触液体后的温度变化，这片小湖值得单独画一张地图。
		TritonSrfLanded = #ASS_TritonSrfLandedcrewReport // 舷窗外的地面坚硬而寒冷，冰层上覆着一层颜色较深的细碎物质。你把附近的低地列为下一步考察目标，希望在那里找到冰原上少量湖泊的踪迹。
		TritonFlyingLowMethaneLake = #ASS_TritonFlyingLowcrewReportMethaneLake // 广阔的平滑冰原一直延伸到远处，只有少数凹地显出液面反光。你将相邻的几处液氮湖圈在同一张照片上，开始寻找一条能连续考察它们的路线。
		TritonSrfLandedMethaneLake = #ASS_TritonSrfLandedcrewReportMethaneLake // 飞船稳稳地落在平滑的冰原上，附近大部分地面仍是坚硬的冰。你把轨道照片中的几个小湖位置导入导航，准备从最近的一处低洼地开始寻找湖岸。
		TritonFlyingLowHills = #ASS_TritonFlyingLowcrewReportHills // 你望着窗外的海卫一，想起一篇60亿年前的旧论文：它预计这颗卫星会在当时的30亿年后解体。你又核对了一遍日期——看来窗外这颗卫星已经“逾期”30亿年了。想到旧宣传图里蓝得发亮的海王星，你忍不住嘀咕：“上次是饱和度拉满，这次是把预测当成倒计时了？”
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[AfterSolarSystem]
{
	@RESULTS
	{
		TritonInSpaceLow = #ASS_TritonInSpaceLowevaReport // 从舱外望去，平滑的冰原比湖面广阔得多。你对照轨道照片，寻找几处相邻的暗斑，并记录它们随观察角度改变的反光，等待进一步确认哪些是湖泊。
		TritonInSpace = #ASS_TritonInSpaceevaReport // 你沿着明暗交界处寻找地貌差异，辨认出高地的起伏和冰原的平整轮廓。那些细小的湖泊还藏在分辨率之外，接近这颗卫星后才能继续寻找。
		TritonFlyingLow = #ASS_TritonFlyingLowevaReport // 冰面上的细小起伏已经能够分辨，疑似湖岸的边缘却仍需要近距离检查。你记下位置，再检查一次与飞船的距离；这次考察需要留下返程的余地。
		TritonFlying = #ASS_TritonFlyLowevaReport // 寒冷的稀薄气体从宇航服周围流过，下方仍是大片冰原。你记录可见的凹地与坡面，试着找出哪些地方值得安排一次着陆考察。
		TritonSrfLanded = #ASS_TritonevaSrfLanded // 脚下的薄层颗粒容易被拨开，露出的冰却像岩石一样坚硬。你记录颜色与表面纹理的变化，沿着低缓地形继续寻找湖岸，宇航服的保温系统始终没有休息。
		TritonSrfSplashed = #ASS_TritonSrfSplashedevaReport // 液氮接触宇航服外层，温度警报让你立刻注意起接缝与密封。你将自己固定在飞船旁，记录湖液与岸边冰层的接触情况，尽快完成这次舱外观察。
		TritonSrfLandedMethaneLake = #ASS_TritonSrfLandedevaReportMethaneLake // 靴子下的冰面平整而坚硬，细碎颗粒只在浅凹处稍多一些。你边走边标记这些地势变化，试着在大片冰原中找到通往少量湖泊的路线。
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[AfterSolarSystem]
{
	@RESULTS
	{
		TritonSrfSplashed = #ASS_TritonSrfSplashed // 你用预冷的取样器收集少量液氮，将它转入带有温压监测的低温样本容器。湖液与岸边固体将分别保存，以便比较其中的微量成分。
		TritonSrfLanded = #ASS_TritonSurfSample // 你先收集表面的细碎覆盖物，再凿下一小块较致密的冰。两份样本分装在低温密闭容器中，保留它们原有的层次，也方便以后比较颜色与成分的差别。
		TritonSrfLandedIceLake = #ASS_TritonSurfSampleIceLake // 这片凹地的冰层露出地表，浅色冰屑中夹着少量深色颗粒。你分别保存冰层与覆盖物，注明取样深度；这份样本能帮助比较冰面不同部位的物质分布。
		TritonSrfLandedMethaneLake = #ASS_TritonSurfSampleMethaneLake // 平滑冰原上只有薄薄的颗粒覆盖层，下面的冰坚硬而致密。你将两层分别取样，标记它们与最近候选湖区的位置关系，再放入低温密闭容器。
		TritonSrfLandedHills = #ASS_TritonSurfSampleHills // 坡脚积着较多细颗粒，坡面则露出坚硬的冰。你分别收集两处的物质，保留粒径与取样位置的记录，准备检查缓慢的坡面搬运留下了什么差别。
		TritonSrfLandedHightLands = #ASS_TritonSurfSampleHightLands // 高地冰层的断口呈现出不同粗细的颗粒，表面覆盖物则更加松散。你分别保存样本并记录它们的结构；冰层的年龄和形成经历要留给后续分析。
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[AfterSolarSystem]
{
	@RESULTS
	{
		TritonSrfLandedMethaneLake = #ASS_temperatureScan_Triton_SrfLanded_Biome010 // 你分别记录受光冰面与湖岸附近的温度，并注明探头的位置和遮阴情况。两组读数将用于比较冰层与湖边环境的热响应，测量过程中也要避开飞船传来的余热。
	}
}
