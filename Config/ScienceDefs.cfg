		VestaSrfLanded = #ASS_VestaSrfLandedcrewReport//这个地表昏暗的世界拥有着许多石头分布其中，看起来平平无奇，没有什么值得你注意的地方。
		VestaSrfLandedEquatorialMountains = #ASS_VestaSrfLandedcrewReportEquatorialMountains//这里的山峰似乎明显的比其它区域要高，这或许正是因为低重力环境下的结果。

		JupiterInSpaceLow = #ASS_JupiterInSpaceLowcrawReport//木星几乎填满了整扇舷窗。对照古老的影像，你发现那些曾经醒目的红褐色云带正在褪色，大片亮白的云层让它的面孔变得陌生。云带边缘仍卷起层层旋涡，这颗巨行星显然还没有安静下来。
		JupiterInSpace = #ASS_JupiterInSpacecrewReport//远处的木星依然庞大，四颗伽利略卫星在它周围缓慢移动。你翻出旧时代留下的彩色照片：曾经鲜明的红色条纹，如今只剩淡淡的轮廓，乳白色的云层占据了更多地方。我们或许正在见证这颗古老行星换上一副新的面孔。
		JupiterFlying = #ASS_JupiterFlyingcrewReport//航迹开始受到大气阻力的影响，你把压力、姿态变化和舷窗外的云层一同记入报告。木星从远处看起来柔和了许多，但随着飞船下降，越来越频繁的颠簸让你重新抓紧了扶手。
		JupiterFlyingPR = #ASS_JupiterFlyingcrewReportPR//极地的旋涡仍卷着氨云，这是木星旧日面貌留下的一点痕迹。与同一区域的旧观测相比，氨云的覆盖正在缩小，云团之间出现了更多间隙。你沿着旋涡边缘拍摄，希望记录下这些残存云层的变化。
		JupiterFlyingTB = #ASS_JupiterFlyingcrewReportTB//温带云层被拉成细长的灰白色条纹，边缘不断卷起小旋涡。你把云带边界的位置标在图上，准备与水云带和极地云团的观测放在一起比较，寻找这场变化在不同纬度留下的痕迹。
		JupiterFlyingEB = #ASS_JupiterFlyingcrewReportEB//旧资料中那条颜色浓重的红褐色云带，如今只剩下浅淡的棕灰色。沿着云带边缘拍摄的连续影像仍显示出明显的剪切与翻卷；颜色正在褪去，大气的运动却依然清楚地写在这些纹路里。
		JupiterFlyingLowEZ = #ASS_JupiterFlyingcrewReportEZ//飞船沿赤道带上空前进，你下意识地在观测云图中寻找那个熟悉的“大红斑”，随后才想起，它早在六十多亿年前就已经消失了。窗外只剩浅色云带与不断更替的旋涡。看来这次需要更新的，除了云图，还有你脑海里那张木星的老照片。
		JupiterFlyingLowWaterCloudsBands = #ASS_JupiterFlyingLowcrewReportWaterCloudsBands//你翻出旧木星的云层示意图，又看了看舷窗外铺展的亮白云带。如今在这里占据显眼位置的是水云，寒冷的云层中以水冰颗粒为主，早已不是旧图中那层熟悉的氨云。你在报告里画下云顶和缝隙的位置，这张图大概也该更新了。

		IoInSpaceLow = #ASS_IoInSpaceLowcreawReport//透过舷窗，你至少看到了数十座活火山，它们正在缓缓地向外溢出熔岩，你知道它们随时都有喷发的可能性。
		IoInSpace = #ASS_IoInSpace//你注意到这颗卫星表面存在着火山运动，火山喷发将熔岩喷发至近一百千米高的地方。
		IoSrfLanded = #ASS_IoSrfLandedcrewReport//飞船上的盖革计数器正在疯狂的响着。这一场旅途或许是危险的。
