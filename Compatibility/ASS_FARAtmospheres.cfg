// ASS atmosphere viscosity calibration for the installed FAR 0.17 loader.
// viscosityAtReferenceTemp: dynamic viscosity in Pa.s; referenceTemp: kelvin.
// These are paired calibration values, not temperature overrides for Kopernicus.
// FAR fixes Sutherland S=110 K; dilute-gas mixture estimates cannot model the
// full pressure/temperature range, condensation, or stellar plasma transport.
// Use actual Body.name values: atmospheric-only sequential indexes are invalid.
// Methods: Chapman-Enskog (Neufeld collision integral), Wilke mixture rule.
// Data: Cantera v3.2.0 gri30.yaml; He: Stanford FFCM-2 transport table.
@FARAeroData[default]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	!BodyAtmosphericData,* {}
	#@AfterSolarSystemSettings {}

	// 太阳 | H 59.82%, He 39.96%, C 0.02%, N 0.01%, O 0.01%, Ne 0.01%, Mg 0.01%, Si 0.01%, S 0.01%, Fe 0.01%
	// 保留旧恒星有效黏度曲线，仅换参考点；不是等离子体黏度重算。
	BodyAtmosphericData
	{
		name = Sun
		viscosityAtReferenceTemp = 7.290098E-05
		referenceTemp = 5640.81
	}

	// 火星 | N2 71.68%, O2 26.81%, H2O 1.02%, Ar 0.66%, CO2 0.52%
	// 注释总量 100.69%，按比例归一化后估算。
	BodyAtmosphericData
	{
		name = Mars
		viscosityAtReferenceTemp = 1.894000E-05
		referenceTemp = 304.44
	}

	// 地球 | CO2 96.09%, N2 0.87%, H2O 3.04%
	BodyAtmosphericData
	{
		name = Earth
		viscosityAtReferenceTemp = 5.127000E-05
		referenceTemp = 1369.92
	}

	// 金星 | CO2 96.5%, N2 3.5%
	BodyAtmosphericData
	{
		name = _Venus
		viscosityAtReferenceTemp = 3.562000E-05
		referenceTemp = 823.46
	}

	// 冥王星 | N2 99.7%, CH4 0.15%, CO 0.15%
	BodyAtmosphericData
	{
		name = Pluto
		viscosityAtReferenceTemp = 3.655000E-06
		referenceTemp = 54.15
	}

	// 木星 | H2 98.8%, He 1.2%
	BodyAtmosphericData
	{
		name = Jupiter
		viscosityAtReferenceTemp = 6.313000E-06
		referenceTemp = 173.81
	}

	// 木卫二 | O2 80%, N2 20%
	BodyAtmosphericData
	{
		name = Europa
		viscosityAtReferenceTemp = 1.230000E-05
		referenceTemp = 166.62
	}

	// 木卫三 | N2 97%, O2 2.9%, CO2 0.09%, NH3 0.01%
	BodyAtmosphericData
	{
		name = Ganymede
		viscosityAtReferenceTemp = 1.205000E-05
		referenceTemp = 181.18
	}

	// 木卫四 | N2 98%, CO2 1.5%, O2 0.49%, NH3 0.01%
	BodyAtmosphericData
	{
		name = Callisto
		viscosityAtReferenceTemp = 1.281000E-05
		referenceTemp = 196.37
	}

	// 土星 | H2 96.3%, He 3.25%, CH4 0.45%
	BodyAtmosphericData
	{
		name = Saturn
		viscosityAtReferenceTemp = 5.397000E-06
		referenceTemp = 134.32
	}

	// 土卫六 | N2 95.4%, CH4 4.4%, C2H6 0.2%
	BodyAtmosphericData
	{
		name = Titan
		viscosityAtReferenceTemp = 1.115000E-05
		referenceTemp = 169.92
	}

	// 天王星 | H2 82.5%, He 15.2%, CH4 2.3%
	BodyAtmosphericData
	{
		name = Uranus
		viscosityAtReferenceTemp = 4.765000E-06
		referenceTemp = 95.24
	}

	// 海王星 | H2 80%, He 19%, CH4 1%
	BodyAtmosphericData
	{
		name = Neptune
		viscosityAtReferenceTemp = 4.412000E-06
		referenceTemp = 82.18
	}

	// 海卫一 | N2 99.8%, CH4 0.1%, CO 0.1%
	BodyAtmosphericData
	{
		name = Triton
		viscosityAtReferenceTemp = 4.242000E-06
		referenceTemp = 62.71
	}
}

@FARAeroData[default]:HAS[@AfterSolarSystemSettings:HAS[#TheMuna[?rue]]]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	// 稽神星（可选） | N2 96.7%, CO 0.8%, O2 0.5%, Ar 2%
	BodyAtmosphericData
	{
		name = Muna
		viscosityAtReferenceTemp = 4.475000E-06
		referenceTemp = 65.72
	}
}

@FARAeroData[default]:HAS[@AfterSolarSystemSettings:HAS[#ThePlanetNine[?rue]]]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	// 第九行星（可选） | H2 80%, He 17%, CH4 3%
	// 采用 50 K 标定；更低温度由 FAR 外推，不含凝结和量子修正。
	BodyAtmosphericData
	{
		name = PlanetNine
		viscosityAtReferenceTemp = 2.815000E-06
		referenceTemp = 50.00
	}
}

@FARAeroData[default]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	!AfterSolarSystemSettings {}
}
