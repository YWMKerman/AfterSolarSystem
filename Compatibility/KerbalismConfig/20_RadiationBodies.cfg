RadiationBody:NEEDS[AfterSolarSystem,Kerbalism]
{
    name = ASS_Seed_RadiationBody_Sun
}
!RadiationBody[Sun]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism] {}
@RadiationBody[ASS_Seed_RadiationBody_Sun]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism]
{
    @name = Sun
    %radiation_model = ASS_Heliopause
    %radiation_inner = 0
    %radiation_outer = 0
    %radiation_pause = #$@ASSKerbalismSettings/HeliosphereShielding$
    %radiation_surface = #$@ASSKerbalismSettings/SolarRadiationAtOneAU$
    @radiation_surface *= 149597870700
    @radiation_surface *= 149597870700
    @radiation_surface /= #$@Kopernicus/Body[Sun]/Properties/radius$
    @radiation_surface /= #$@Kopernicus/Body[Sun]/Properties/radius$
    %solar_cycle = #$@ASSKerbalismSettings/SolarCycleSeconds$
    %solar_cycle_offset = 0
}

