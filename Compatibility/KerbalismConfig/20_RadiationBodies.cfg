// 全部使用ASS实际Body.name，包括_Venus、_Mimas、_Eris、_Dysnomia。
// 先清除同名旧记录，再创建唯一新记录；当前Kerbalism同名第一条生效。
// 未启用的可选天体会由Kerbalism安全跳过，不会绑定到其他天体。
// 无本地磁场仍会接受父行星/太阳的辐射贡献及实际大气的自动衰减。
// 不指定数字reference，使用当前Kerbalism的父恒星默认参考系。
!RadiationBody[Moho]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism] {}
