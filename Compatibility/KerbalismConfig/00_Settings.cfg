// ASS: 61 亿年后的环境预设。以下数值是可调整的模型假设，并非精确恒星演化预测。
// 原 KerbalismConfig 仍提供生命维持和部件配置；此目录只覆盖环境。
ASSKerbalismSettings:NEEDS[AfterSolarSystem,Kerbalism]
{
    // 基准常态太阳项，rad/h，按物理 1 AU 标定；不代表风暴剂量。
    SolarRadiationAtOneAU = 0.004
    // 球形日球层边界，AU；200 AU 仍在第九行星近日点约205.9 AU以内。
    HeliopauseAU = 200
    // 磁层半径缩放。示意压力平衡：Pwind约2.78倍时，Rmp约0.8434倍。
    // 此项只缩小磁层边界，不自动压缩辐射带或放大带内剂量。
    MagnetopauseScale = 0.8434326653017492
    // 银河宇宙线背景与日球层内的加性屏蔽项，均为rad/h。
    InterstellarRadiation = 0.019
    HeliosphereShielding = -0.010
    // 保留11个地球年的缓慢周期；设0可关闭周期变化，与风暴开关独立。
    SolarCycleSeconds = 346896000
}

@Kerbalism:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism]
{
    // 按作者选择继续关闭太阳风暴。
    %SpaceWeather = false
    %StormFrequency = 0
    %ExternRadiation = #$@ASSKerbalismSettings/InterstellarRadiation$
}
