// 独立ASS模型，避免改写Kerbalism原生模型，便于移除本适配。
// 几何长度单位为天体半径，从天体中心计；不是米，也不是离地高度。
// 巨行星辐射带沿用原配置形状和数量级；只压缩磁层顶。
// 第九行星在日球层之外，采用未套用太阳风压缩的暂定巨行星模型。
// 先插入唯一临时节点，再于晚期pass改名；兼容不支持根节点%的ModuleManager。
RadiationModel:NEEDS[AfterSolarSystem,Kerbalism]
{
    name = ASS_Seed_RadiationModel_ASS_Unmagnetized
}
!RadiationModel[ASS_Unmagnetized]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism] {}
@RadiationModel[ASS_Seed_RadiationModel_ASS_Unmagnetized]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism]
{
    @name = ASS_Unmagnetized
    %has_inner = false
    %has_outer = false
    %has_pause = false
}

RadiationModel:NEEDS[AfterSolarSystem,Kerbalism]
{
    name = ASS_Seed_RadiationModel_ASS_Heliopause
}
!RadiationModel[ASS_Heliopause]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism] {}
@RadiationModel[ASS_Seed_RadiationModel_ASS_Heliopause]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism]
{
    @name = ASS_Heliopause
    %has_inner = false
    %has_outer = false
    %has_pause = true
    %pause_radius = #$@ASSKerbalismSettings/HeliopauseAU$
    @pause_radius *= 149597870700
    @pause_radius /= #$@Kopernicus/Body[Sun]/Properties/radius$
    %pause_compression = 1
    %pause_extension = 1
    %pause_height_scale = 1
    %pause_deform = 0
    %pause_quality = 0.01
}

RadiationModel:NEEDS[AfterSolarSystem,Kerbalism]
{
    name = ASS_Seed_RadiationModel_ASS_Mercury
}
!RadiationModel[ASS_Mercury]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism] {}
@RadiationModel[ASS_Seed_RadiationModel_ASS_Mercury]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism]
{
    @name = ASS_Mercury
    %has_pause = true
    %pause_radius = 1.6
    @pause_radius *= #$@ASSKerbalismSettings/MagnetopauseScale$
    %pause_compression = 1.4
    %pause_extension = 0.05
    %pause_height_scale = 1
    %pause_quality = 10.0
    %pause_deform = 0.1
    %has_inner = false
    %has_outer = false
}

RadiationModel:NEEDS[AfterSolarSystem,Kerbalism]
{
    name = ASS_Seed_RadiationModel_ASS_Jupiter
}
!RadiationModel[ASS_Jupiter]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism] {}
@RadiationModel[ASS_Seed_RadiationModel_ASS_Jupiter]:NEEDS[AfterSolarSystem,Kerbalism]:FOR[zzzzAfterSolarSystemKerbalism]
{
    @name = ASS_Jupiter
    %has_inner = true
    %inner_dist = 6.0
    %inner_radius = 1.0
    %inner_compression = 1.05
    %inner_extension = 0.9
    %inner_quality = 30.0
    %has_outer = true
    %outer_dist = 6.5
    %outer_radius = 6.5
    %outer_compression = 1.05
    %outer_extension = 0.85
    %outer_quality = 30.0
    %has_pause = true
    %pause_radius = 60
    @pause_radius *= #$@ASSKerbalismSettings/MagnetopauseScale$
    %pause_compression = 1.05
    %pause_extension = 0.01
    %pause_height_scale = 1.02
    %pause_quality = 20.0
    %outer_border_dist = 0.001
    %outer_border_radius = 0
    %outer_border_deform_xy = 1
}

