        #ASS_TritonFlyingLowcrewReportMethaneLake = 广阔的平滑冰原一直延伸到远处，只有少数凹地显出液面反光。你将相邻的几处液氮湖圈在同一张照片上，开始寻找一条能连续考察它们的路线。
        #ASS_TritonSrfLandedcrewReportMethaneLake = 飞船稳稳地落在平滑的冰原上，附近大部分地面仍是坚硬的冰。你把轨道照片中的几个小湖位置导入导航，准备从最近的一处低洼地开始寻找湖岸。
        #ASS_TritonSrfLandedevaReportMethaneLake = 靴子下的冰面平整而坚硬，细碎颗粒只在浅凹处稍多一些。你边走边标记这些地势变化，试着在大片冰原中找到通往少量湖泊的路线。
        #ASS_temperatureScan_Triton_SrfLanded_Biome010 = 你分别记录受光冰面与湖岸附近的温度，并注明探头的位置和遮阴情况。两组读数将用于比较冰层与湖边环境的热响应，测量过程中也要避开飞船传来的余热。
        #ASS_TritonFlyingLowcrewReportHills = 你望着窗外的海卫一，想起一篇60亿年前的旧论文：它预计这颗卫星会在当时的30亿年后解体。你又核对了一遍日期——看来窗外这颗卫星已经“逾期”30亿年了。想到旧宣传图里蓝得发亮的海王星，你忍不住嘀咕：“上次是饱和度拉满，这次是把预测当成倒计时了？”

    }
}











