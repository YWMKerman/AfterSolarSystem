        // Revised moon observations, surface samples, and Triton lake surveys.
        #ASS_EuropaFlyingcrewReportCraters = The crater rims and surrounding fragments grow clearer. You steer around the steep walls, noting terrain suitable for a safe landing and sampling.
        #ASS_surfaceSample_Europa_SrfLanded_Lake = Fine chips of ice and dark grains have collected on the trough floor. You take samples from the floor and wall, labeling each location to investigate how the material accumulated here.
        #ASS_surfaceSample_Europa_SrfLanded_Cilff = A thin surface layer covers more intact ice on the fissure wall. A freshly chipped fragment exposes a clear fracture face. You seal it carefully before heat from the tools can alter the sample.
        #ASS_surfaceSample_Europa_SrfLanded_RiverValley = You collect separate samples from the trough wall and loose deposits on its floor. Differences in grain size and fragmentation may help reconstruct how the ice was broken and moved.
        #ASS_surfaceSample_Europa_SrfLanded_Craters = Ice fragments around the crater rim vary in size, and some have textures unlike the surrounding surface. You seal the fragments and fine debris separately to investigate whether they came from different depths.
        #ASS_GanymedeSrfLandedcrewReportYunJikeng = From the crater floor, the curved walls fill the distant view, with broken material scattered nearby. You mark the spacecraft's position on the survey map, adding a ground reference for the orbital photographs.
