        #ASS_P9_name = Planet Nine
        #ASS_P9_desc = <color=#7B007B>This enormous, forgotten world has long lurked at the system's distant frontier, making it the last to be discovered.\nFor ages, its star's light could not reach it, leaving it dark and unseen. Now the star's final light is beginning to illuminate that darkness. After nearly ten billion years in hiding, this world is finally revealing its true face.
        #ASS_P9_Biome1 = Bright Cloud Bands
        #ASS_P9_Biome2 = Dark Cloud Bands
        #ASS_P9_Biome3 = White Clouds
        #ASS_P9_Biome4 = Storm Eye
        #ASS_P9_Biome5 = Polar Regions

        #ASS_Muna_name = Muna
        #ASS_Muna_desc = This enormous interloper was captured by the Sun's gravity when it wandered into the solar system billions of years ago. It now follows a distant orbit at the system's outer edge, alongside the trans-Neptunian objects (TNOs). Temperatures are still too harsh for a prolonged stay, but when the Sun reaches its peak, this world will become an inviting, habitable home.\nIts atmosphere is already warming, and microorganisms and plants on the surface are beginning to produce oxygen in the Sun's still-faint light...
