        #ASS_Moll_name = Moll
        #ASS_Moll_desc = A great wanderer of the cosmos, this moon has spent ten billion years accompanying the enormous rocky planet on its journey from a dim red dwarf system to our own. To us, it is more than an unassuming moon: it is a vast living fossil.
