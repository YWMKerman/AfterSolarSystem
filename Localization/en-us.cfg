        #ASS_atmosphereAnalysis_Muna_FlyingHigh = The sample thins with altitude, with nitrogen still dominant. We flag the trace oxygen readings separately, reminding ourselves not to mistake a single gas for conclusive evidence of life.
        #ASS_atmosphereAnalysis_Sun_FlyingLow = The analyzer identifies hydrogen and helium in the searing sample, along with traces of heavier elements. Its casing is heating rapidly too. We hope we are transmitting the composition of the star, not of the analyzer.
        #ASS_atmosphereAnalysis_Sun_FlyingHigh = The gas here is extremely thin, yet still searingly hot. Hydrogen and helium dominate the signals. The recorded temperature and density show that a star's outer layers are not simply an extension of an ordinary planetary atmosphere.
        #ASS_atmosphereAnalysis__Venus_SrfLanded_Biome007 = After sampling on the peak, you compare the readings with records from lower terrain. Carbon dioxide still dominates. Higher ground has not turned this into a pleasant refuge.
        #ASS_atmosphereAnalysis__Venus_FlyingLow_Biome002 = Crossing the lava sea, you record the gas sample alongside the location of the heat source below. Carbon dioxide still dominates the background gas; any local differences will take more samples to confirm.
        #ASS_atmosphereAnalysis_Earth_SrfLanded_Biome002 = Carbon dioxide and scorching water vapor still fill the atmosphere above this continent. The analysis no longer carries the familiar proportions that once made this place home.
        #ASS_atmosphereAnalysis_Earth_FlyingLow_Biome001 = Above the lava sea, you record the gas composition, temperature, and altitude to distinguish surface heating from changes in the wider atmosphere. The water signal comes from vapor, not from the churning sea below.
        #ASS_atmosphereAnalysis_Mars_SrfLanded_Biome001 = Even on this great mountain, the nitrogen-oxygen composition is familiar. You make a separate note of the pressure: the same gases do not make conditions identical on every summit.
        #ASS_atmosphereAnalysis_Mars_SrfLanded_Biome005 = You collect air in the canyon and compare its water vapor reading with records from open plains. This lower terrain may shelter different local conditions.
        #ASS_atmosphereAnalysis_Mars_SrfLanded_Biome027 = You raise the intake to keep muddy water out of the air sample. The analyzer records nitrogen, oxygen, and water vapor. The smell of this swamp is outside the scope of the experiment.
        #ASS_atmosphereAnalysis_Mars_FlyingLow_Biome010 = The sample over the plateau is still dominated by nitrogen and oxygen. Comparing readings at matching altitudes should help separate terrain effects from the effects of flight altitude.
        #ASS_atmosphereAnalysis_Europa_SrfLanded_Biome006 = You aim the intake toward a fissure in the ice, looking for a signal distinct from the thin surrounding atmosphere. Oxygen still dominates the reading; any contribution from the depths remains to be confirmed.
        #ASS_atmosphereAnalysis_Europa_SrfLanded_Biome002 = Even in these lowlands, the chamber takes a long time to gather enough gas. The oxygen-dominated atmosphere has not become substantial just because we are closer to the ground.
        #ASS_atmosphereAnalysis_Ganymede_SrfLanded_Biome001 = You collect gas in the depression, looking for differences from highland samples. Nitrogen still dominates, and the small amount of oxygen is not enough to mistake this for another wetland on Earth.
        #ASS_atmosphereAnalysis_Ganymede_FlyingLow_Biome003 = The instrument collects a cold nitrogen sample above the impact crater. You retain the precise altitude and position, so changes along the flight path are not mistaken for a gas unique to the crater.
        #ASS_atmosphereAnalysis_Callisto_SrfLanded_Biome004 = A longer sampling period on the highlands finally yields enough gas for analysis. Nitrogen and carbon dioxide remain more prominent than oxygen.
        #ASS_atmosphereAnalysis_Callisto_SrfLanded_Biome005 = The name of this region raises hopes of finding gases from the interior. You preserve the sample carefully, without taking the name alone as evidence of an ongoing eruption.
        #ASS_atmosphereAnalysis_Jupiter_FlyingLow_Biome001 = Along the equatorial belt, you record the temperature and pressure of the hydrogen-helium gas. The cloud colors are striking, but color alone cannot reveal the precise composition of the mixture.
        #ASS_atmosphereAnalysis_Saturn_FlyingLow_Biome003 = Within the whitening equatorial clouds, the analyzer still identifies hydrogen, helium, and a little methane. We save the sample for future observers to compare changes in composition with changes in color.
        #ASS_atmosphereAnalysis_Titan_SrfLanded_Biome003 = In the lowlands, you collect a dense, cold nitrogen sample with clear methane and ethane signals. The instrument leaves a more specific record of these hazy skies than a photograph could.
        #ASS_atmosphereAnalysis_Titan_SrfLanded_Biome008 = You store gas from near the delta separately from samples taken in the distant highlands. Methane and ethane are still present, but the terrain's name alone cannot tell us what might be flowing here now.
        #ASS_atmosphereAnalysis_Uranus_FlyingLow_Biome004 = The instrument samples repeatedly in the storm region, recording the pressure each time. Hydrogen, helium, and methane remain the main findings. We hope the data will help distinguish changes in the gas from the spacecraft's motion.
        #ASS_atmosphereAnalysis_Neptune_FlyingLow_Biome001 = You preserve a sequence of samples near the storm eye. Hydrogen and helium dominate, but the changing sampling conditions must be recorded too if later comparisons are to be meaningful.
        #ASS_atmosphereAnalysis_Neptune_FlyingLow_Biome004 = You try to record cloud condensates separately from the surrounding gas. Hydrogen and helium still dominate the background, helping us investigate whether the clouds differ in composition from the bulk atmosphere.
        #ASS_atmosphereAnalysis_Triton_SrfLanded_Biome005 = Nitrogen still dominates the highland sample. You compare it with readings from lower ground, looking for changes in this thin atmosphere across the terrain.
        #ASS_atmosphereAnalysis_PlanetNine_FlyingLow_Biome003 = The sample from the white clouds still shows hydrogen, helium, and methane. You remind yourself that a bright appearance does not make this atmosphere anything like the air at home.
        #ASS_atmosphereAnalysis_Pluto_SrfLanded_Biome013 = The gas collected above Tombaugh Regio is almost entirely nitrogen. You pair the sample with temperature records from the surface ice, hoping to follow slow changes between them over time.
        #ASS_atmosphereAnalysis_Muna_SrfLanded_Biome006 = The sample near the ice cap is still mostly nitrogen, with argon and carbon monoxide. After detecting a little oxygen, you make a point of noting that this is not proof of life.
        #ASS_atmosphereAnalysis_Muna_SrfLanded_Biome002 = You collect a cold gas sample in Yuanqian. The name sounds welcoming, but the carbon monoxide and scarce oxygen on the composition chart make a helmet essential.
        #ASS_atmosphereAnalysis_Neptune_SrfLanded = The analyzer attempts to sample this deep environment, but extreme pressure makes stable readings difficult. Even with the spacecraft at rest, this is nothing like surface air on an ordinary planet.
