        #ASS_Dysnomia_name = Dysnomia
        #ASS_Dysnomia_desc = This dark, ominous moon circles close to its dwarf planet at the far edge of the solar system. As the Sun enters its final blaze of glory, Dysnomia's dark surface greedily absorbs its energy. The moon is warming, reaching temperatures a little higher than those of the world below. Even so, it remains barren and deathly silent.
        #ASS_Dysnomia_Biome1 = Craters
