        #ASS_Eris_desc = Eris is a bitterly cold world beyond humanity's reach, pristine and untouched even by asteroid impacts for billions of years.\nAs temperatures rise, we expect its surface nitrogen ice to sublimate. Beneath the thin atmosphere, pressure in some areas may become high enough for the ice to melt. Perhaps lakes of liquid nitrogen await us on this frozen dwarf planet.
