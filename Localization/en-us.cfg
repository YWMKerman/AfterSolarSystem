        #ASS_surfaceSample_Ganymede_SrfLanded = Beneath the loose grains lies hard, ice-bearing material, from which the scoop can scrape only a little debris. You pack fine grains separately from intact fragments to compare their composition and degree of weathering.
        #ASS_surfaceSample_Ganymede_SrfLandedSwamp = Fine grains have accumulated in the depression, with larger fragments encountered as you scrape deeper. You store samples by depth to investigate how the debris collected here.
        #ASS_surfaceSample_Ganymede_SrfLandedlands = The exposed block of hard ice resists sampling, yielding a thin chip only after several taps. A few opaque grains dot the fracture, and you retain nearby loose material as a comparison sample.
        #ASS_surfaceSample_Ganymede_SrfLandedLake = Fine grains and flakes of ice cover this depression, with a firmer frozen layer beneath them. You pack the samples in sequence to preserve clues to how the thin covering accumulated.
        #ASS_surfaceSample_Callisto_SrfLanded_Swamp = A layer of fine grains has collected in the hollow, and the scoop soon meets a hard, ice-bearing layer below. You separate the samples by depth, preserving a record of the debris accumulated here.
        #ASS_surfaceSample_Callisto_SrfLanded_island = At the edge of the raised terrain, you collect pale ice chips and the dark coating beside them. The samples look quite different, so you take care not to let the scoop mix them before they reach the laboratory.
        #ASS_surfaceSample_Callisto_SrfLanded_Hills = Debris is more concentrated at the foot of the slope, with ice fragments among grains of different sizes. You sample both the upper and lower slope to examine whether gradual downslope movement has changed the grain distribution.
        #ASS_TritonFlyingLowcrewReportMethaneLake = The smooth ice plain stretches far into the distance, with liquid reflections in only a few depressions. You circle several neighboring liquid-nitrogen lakes on one photograph and begin planning a route to survey them in sequence.
        #ASS_TritonSrfLandedcrewReportMethaneLake = The spacecraft rests firmly on the smooth plain, with hard ice covering most of the surrounding ground. You load the positions of several small lakes from orbital photographs into the navigation system and plan to search for a shore in the nearest hollow.
        #ASS_TritonSrfLandedevaReportMethaneLake = The ice beneath your boots is smooth and hard, with a little more loose debris in the shallow hollows. You mark these subtle changes in relief as you walk, searching for a route to the few lakes scattered across the broad plain.
        #ASS_temperatureScan_Triton_SrfLanded_Biome010 = You record temperatures on sunlit ice and near the shore, noting the probe position and shading. The two sets will help compare the thermal response of the ice plain and the lakeside environment, while keeping spacecraft waste heat out of the measurements.
        #ASS_TritonFlyingLowcrewReportHills = Looking out at Triton, you recall a paper written six billion years ago: it predicted that this moon would break apart three billion years later. You check the date again. The moon outside appears to be three billion years overdue. Then you remember those publicity images of a brilliant blue Neptune. "First they cranked up the saturation; then they turned a prediction into a countdown?"

    }
