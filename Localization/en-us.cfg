        #ASS_Enceladus_name = Enceladus
        #ASS_Enceladus_desc = This tiny icy moon now bears many more fractures than it once did. Fine cracks and ravines of varying depths crisscross the ice, making it look older still. Water vapor and ice crystals continue to erupt into space through some of these fissures. Some fall back to the surface, while the rest leave this world forever. Ages of eruptions have carried away a considerable share of its water, and the process shows no sign of stopping.\n\nThe Saturnian system is warmer than it once was, but the cold still grips this moon. The giant planet overhead is slowly turning white, while the world beneath our feet continues its ancient eruptions. We do not know how much water remains below the ice, or how much longer it can sustain those familiar plumes.\n\n<color=#000014>Reports of fossils in the ice remain unconfirmed. Perhaps the plumes can offer clues to what still lies hidden in the depths.
        #ASS_Enceladus_Biome1 = Depressions
        #ASS_Enceladus_Biome2 = Polar Regions
        #ASS_Enceladus_Biome3 = Mountainous Regions
