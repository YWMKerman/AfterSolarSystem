        #ASS_Minmaus_name = Minmaus
        #ASS_Minmaus_desc = This red moon is the closest companion of the enormous rocky world below. It is spiraling inward by several centimeters a year, and we believe the faint rings beneath it offer a glimpse of its eventual fate. Even so, we still consider it a lucky moon, nicknamed the "Carp." Long-term observations have revealed that every few decades it seems to leap through Muna's rings: sometimes above them, sometimes below them, and sometimes level with them.\nFor that reason, we do not consider this world dangerous.\n\nWe have also noticed many strangely shaped canyons on its surface. How they formed remains a mystery.
        #ASS_Minmaus_Biome1 = Highlands
        #ASS_Minmaus_Biome2 = Mountains
