        // Custom science reports (crew reports and EVA reports)


        #ASS_SunInSpaceLowcrewReport = You feel the temperature around you rising rapidly. Sunlight pours through the portholes, so intense that you can barely keep your eyes open. \nYou put on your protective shades and look outside. At last, you can make out the immense red sphere hidden behind the glare: a vast mass of plasma, constantly churning and expanding... \nYou begin to wonder whether the spacecraft's thin walls can keep you safe.
        #ASS_SunInSpace = From here, the Sun is the brightest star in the sky. Even from dozens of light-years away, it would be easy to spot, its brilliance outshining the other stars. Yet this is only a star's final blaze of glory before death, a fate that awaits them all.
        #ASS_SunInSpaceLowevaReport = My body temperature is rising fast. Can my spacesuit really keep me safe?
        #ASS_SunSunInSpaceevaReport = Perhaps it is safe to watch the dazzling star from this distance. You lower your sun visor and gaze at it, wondering, "Will the Sun really undergo a helium flash?"
        #ASS_SunFlyingcrewReport = We are almost at the chromosphere. Vast masses of plasma churn below as you carefully steer the spacecraft clear of the Sun's coronal mass ejections.
        #ASS_SunFlyingevaReport = "I want to soar into the sky and stand shoulder to shoulder with the Sun. The world is waiting for me to change it. I'm not afraid to let others see my dreams. Here, I can make them all come true."

        #ASS_MercuryInSpaceLowcrewReport = You look down at the charred surface and observe some geological structures you've never seen before.
        #ASS_MercuryInSpace = Look! The planet is glowing dark red.
        #ASS_MercuryInSpaceLowevaReport = You look outside at the rocks below, glowing dark red in the searing heat, and the blazing sea of lava.
        #ASS_MercuryInSpaceevaReport = Look, a faint red point of light. How dim and tiny it seems beside the dazzling Sun.
        #ASS_MercurySrfLanded = This seems to be a desolate world, with only a few large rocks scattered across the surface.
        #ASS_MercurySrfSplashedcrewReport = We have landed on scorching lava. The heat makes the inside of our spacecraft feel like an oven.
        #ASS_MercuryevaSrfLanded = The rock beneath your feet seems soft. Walking on it feels like trudging through a swamp, and it seems strangely sticky, too.
        #ASS_MercurySrfSplashedevaReport = I think I'm in trouble.

        #ASS_VenusInSpaceLowcrewReport = A scorching hellscape of lava, volcanoes, and enormous boulders. \nI don't want to go down there.
        #ASS_VenusInSpacecreawReport = With the atmosphere gone, we can finally see the once-hidden surface. It looks terrifying.
        #ASS_VenusInSpaceLowevaReport = You look down at the hellish world below.
        #ASS_VenusInSpaceevaReport = It looks just the same. Has anything changed?
        #ASS_VenusSrfLandedcrewReport = The rock beneath the spacecraft seems soft, but luckily we haven't sunk into it.
        #ASS_VenusSrfSplashedcrewReport = We have landed on scorching lava. The heat makes the inside of our spacecraft feel like an oven.
        #ASS_VenusevaSrfLanded = You stand on soft, "muddy" rock as vaporized rock drifts steadily skyward.
        #ASS_VenusSrfSplashedevaReport = I think I'm in trouble.
        #ASS_VenusSrfLandedcrewReportPeak = This enormous mountain seems to have survived billions of years of intense geological activity.
        #ASS_VenusInSpaceLowevaReportPeak = At last, you recognize a few familiar peaks.
        #ASS_VenusevaSrfLandedPeak = This world has finally settled down.
        #ASS_VenusFlyingcrewReport = The world below seems to churn endlessly, as if showing you its fury.
        #ASS_VenusFlyingcrewReport = You fly over this scorching hellscape. Through the porthole, you see lava, volcanoes, and enormous boulders covering the surface. \nYou don't want to go down there.

        #ASS_EarthInSpaceLowcrewReport = It still looks hot. Through the porthole, you watch the world below glowing dark red.
        #ASS_EarthInSpacecrewReport = How did our former home end up like this...?
        #ASS_EarthInSpaceLowevaReport = The blue skies, white clouds, and azure oceans are gone... \nScorching lava and red-hot ground have taken their place.
        #ASS_EarthInSpaceevaReport = Was this really once our home?
        #ASS_EarthFlyingcrewReport = And so the thrill ride begins!
        #ASS_EarthSrfLandedcrewReport = The ground is scorching, and the air is thick with water vapor at nearly a thousand degrees Celsius. The searing air bakes the spacecraft's hull. It feels as though the whole ship could burn up at any moment.
        #ASS_EarthFlyingevaReport = I think I'm in trouble.
        #ASS_EarthSrfSplashedcrewReport = We have landed in scorching lava. With temperatures this high, won't our spacecraft burn up?
        #ASS_EarthFlyingLowevaReport = The thin atmosphere can hardly slow me down.
        #ASS_EarthevaSrfLanded = You walk across the soft ground, searching for something.
        #ASS_EarthSrfSplashedevaReport = I think I'm in trouble.
        #ASS_EarthSrfLandedcrewReportPanguland = You notice something you remember.
        #ASS_EarthSrfSplashedcrewReportPanguland = The lava seems to be boiling.
        #ASS_EarthevaSrfLandedPanguland = I feel like the land is melting.
        #ASS_EarthInSpaceevaReportPanguland = This world has become an inferno.

        #ASS_MoonInSpaceLowcrewReport = You scan the lunar surface, searching for the landers and probes humanity left behind.
        #ASS_MoonInSpace = Gazing at the Moon outside the window, so familiar yet so strange, you recall a verse by a forgotten Chinese poet from billions of years ago: "As a child, I knew not the Moon, and called it a plate of white jade."
        #ASS_MoonInSpaceLowevaReport = You study the lunar surface, hoping to spot something. A long scar catches your eye. At first, you think a sliding rock must have left it, but the object at the end tells a different story: a wrecked probe.
        #ASS_MoonInSpaceevaReport = A desolate, cratered world with a few lava lakes. Perhaps it isn't all that hot?
        #ASS_MoonSrfLandedcrewReport = We choose to go to the Moon!
        #ASS_MoonSrfLandedevaReport = You step onto this familiar yet unfamiliar ground, picturing humanity's first Moon landing. Looking back at your footprints, you feel as though you have returned to that moment in history. It all seems so familiar.
        #ASS_MoonInSpaceLowevaReportMoonSea = The lunar maria below still look so familiar.
        #ASS_MoonSrfLandedevaReportMoonSea = Echoes of days gone by.
        #ASS_MoonSrfLandedcrewReportMoonSea = Seven billion years after 1969, we set foot here once more. We gaze at our familiar homeland with sadness, knowing we can never return.

        #ASS_MarsInSpaceLowcreawReport = We have reached low Mars orbit. Mars fills the view through the porthole. You let go and enjoy the feeling of weightlessness.
        #ASS_MarsInSpaceLowcreawReport1 = You press close to the window, trying to spot Phobos.
        #ASS_MarsInSpace = Through the porthole, you search for Mars's two moons, Phobos and Deimos.
        #ASS_MarsInSpaceLowevaReport = "Your sky is my horizon."
        #ASS_MarsInSpaceLowevaReportCanyonsailor = Looking down at Valles Marineris, you realize for the first time just how enormous it is.
        #ASS_MarsInSpacevaReport = From this height, you have a sweeping view of Mars in all its beauty.
        #ASS_MarsFlyingcrewReport = You observe a dust storm on the world below.
        #ASS_MarsFlyingcrewReportCanyonsailor = Look, Valles Marineris!
        #ASS_MarsSrfLandedcrewReport = We're home!
        #ASS_MarsSrfLandedcrewReportCanyonsailor = The vast canyon outside the porthole leaves you awestruck.
        #ASS_MarsFlyingLowevaReportCanyonsailor = From this height, Valles Marineris looks immense and beautiful.
        #ASS_MarsSrfSplashedcrewReport = Through the porthole, you watch waves slap against the hull. Perhaps we should stay inside and wait for rescue. But maybe we could go for a swim first?
        #ASS_MarsFlyingLowevaReport = This seems dangerous, but you summon your courage and embrace the blue sky.
        #ASS_MarsFlyingevaReport = This seems dangerous.
        #ASS_MarsSrfLandedevaReport = The air is so hot and humid that you feel as though you are in a steamer. Nobody wants to venture out at noon; people prefer mornings, dusk, or nighttime. You have to accept that the Sun is growing old.
        #ASS_MarsSrfLandedevaReportCanyonsailor = The air around Valles Marineris feels much more humid and much cooler than elsewhere. A cool breeze lifts your long hair.
        #ASS_MarsSrfSplashedevaReport = The water here is so warm, it's like soaking in a hot spring.
        #ASS_MarsFlyingcrewReportOlympus = You fly past Olympus Mons. Through the porthole, you see just how enormous it is. It seems to rise above the atmosphere itself.
        #ASS_MarsSrfLandedcrewReportOlympus = You land high on the slopes of Olympus Mons. Only then do you realize just how high you are: the sky outside the window has deepened from blue to dark blue.
        #ASS_MarsFlyingevaReportOlympus = The air here is so thin that your parachute barely seems to help.
        #ASS_MarsSrfLandedevaReportOlympus = Standing at this great height, you watch eagles soar across the sky and realize how small humanity is.
        #ASS_MarsInSpaceLowevaReportOlympus = The mountain below looks so enormous that it seems to reach into space.
        #ASS_MarsFlyingcrewReportSwamp_ = You fly over a swamp, noticing the dense vegetation below. Take care when choosing a landing site.
        #ASS_MarsSrfLandcrewReportSwamp_ = The ground seems very soft. The spacecraft has left a clear impression where it landed.
        #ASS_MarsSrfSokashedSwamp_ = Your spacecraft has landed in the swamp's mud, splattering the hull with muck.
        #ASS_MarsSrfLandedevaReportSwamp_ = Standing in the muddy swamp, you hear frogs croaking nearby.
        #ASS_MarsFlyingevaReportSwamp_ = The swamp below stretches as far as the eye can see.
        #ASS_MarsSrfSplashedSwamp_ = The croaking seems to come from the water. Perhaps you could catch a frog.
        #ASS_MarsInSpaceLowevaReportSwamp_ = From space, you notice broad swaths of green along the edges of some bodies of water.
        #ASS_MarsSrfLandedevaReportMoran_Sea = The air near home seems filled with a sweet fragrance.
        #ASS_MarsSrfSplashedevaReportMoran_Sea = Even though you know these waters well, venturing out for a swim is still dangerous.
        #ASS_MarsFlyingLowevaReportTaerxisiHeightland = You notice several huge volcanoes.
        #ASS_MarsInSpaceLowevaReportTaerxisiHeightland = Many enormous peaks seem to be clustered on the plateau below.
        #ASS_MarsFlyingLowevaReportTaerxisiHeightland = An endless stony desert.
        #ASS_MarsFlyingcrewReportTaerxisiHeightland = The plateau below seems utterly lifeless. There is no vegetation or soil, only yellow sand swirling through the air.
        #ASS_MarsSrfLandedcrewReportTaerxisiHeightland = It is hot here, and you are starting to feel dehydrated.
        #ASS_MarsFlyingcrewReportMoran_Sea = The familiar landscape outside the window tells you at a glance that you are close to home.
        #ASS_MarsSrfLandedcrewReportMoran_Sea = Where is our home?
        #ASS_MarsSrfSplashedcrewReportMoran_Sea = Time to wait for the rescue team.
        #ASS_MarsFlyingcrewReporthills = Outside the spacecraft, a vast stony desert stretches into the distance, dotted with countless cacti.
        #ASS_MarsFlyingcrewReporthills = I think we should get back inside the spacecraft. This desert heat could leave us dehydrated. We should wait inside for the search and rescue team.
        #ASS_MarsInSpaceLowevaReporthills = You notice the vast desert below.
        #ASS_MarsFlyingLowevaReportCanyonsailorhills = How are we going to find our way home? Should we wait for rescue instead?
        #ASS_MarsSrfLandedevaReporthills = The air around you is scorching, and the Sun beats down mercilessly overhead.
        #ASS_MarsFlyingcrewReportOlympusProMax = Our craft can't seem to generate enough lift to reach the summit.
        #ASS_MarsSrfLandedcrewReportOlympusProMax = Only when you reach the summit do you realize just how enormous this mountain is.
        #ASS_MarsSrfLandedevaReportOlympusProMax = There is so little oxygen here that you have to wear a spacesuit.
        #ASS_MarsInSpaceLowevaReportOlympusProMax = It almost reaches into space.
        #ASS_MarsFlyingLowevaReportOlympusProMax = You notice the enormous volcanic crater.

        #ASS_DeimosInSpaceLowcreawReport = I could probably reach the surface with just my jetpack. A lander seems rather unnecessary here.
        #ASS_DeimosInSpace = A speck of space dust? Interesting. You begin studying the body through the spacecraft's telescope.
        #ASS_DeimosInSpaceevaReport = The tiny world below tempts me to land using only my spacesuit's thrusters.
        #ASS_DeimosSrfLandedcrewReport = Perhaps we don't need a spacecraft to land on this moon at all.
        #ASS_DeimosSrfLandedevaReport = The gravity is so weak that walking is a challenge. One careless step could send you drifting away from the moon altogether.

        #ASS_CeresInSpaceLowcreawReport = The world below now looks parched and gray.
        #ASS_CeresInSpace = It looks so unfamiliar now, nothing like the world we remember.
        #ASS_CeresInSpaceLowevaReport = The dark gray world below has few craters, but plenty of fractures. \nYou would never guess that this ball of rock once had an icy layer nearly a hundred kilometers thick.
        #ASS_CeresInSpaceevaReport = A scoop of ice cream dusted with cocoa powder?
        #ASS_CeresSrfLandedcrewReport = A desolate world, now deathly silent and bereft of life or hope.
        #ASS_CeresSrfLandedevaReport = The rocky grains here are very fine. You also notice a little crystalline material on the ground, though you cannot yet identify it.

        #ASS_VestaInSpace = Maybe it's just an ordinary giant potato.
        #ASS_VestaInSpaceLowcreawReport = Through the window, you see densely packed craters across the dark brown surface. On a world with such low gravity, every mountain seems to tower above the landscape.
        #ASS_VestaSrfLandedcrewReport = Rocks litter this dark landscape. Nothing seems particularly remarkable or worth investigating.
        #ASS_VestaSrfLandedcrewReportEquatorialMountains = The mountains here seem much taller than those elsewhere, perhaps because of the low gravity.
        #ASS_VestaInSpaceLowevaReport = The dark world below is covered in rocky debris of every size and densely packed craters. Nothing catches your interest, so you turn to the stars and gaze at the enormous Andromeda Galaxy.
        #ASS_VestaInSpaceevaReport = A giant dark potato? Is it edible?
        #ASS_VestaSrfLandedevaReport = You suspect that even a gentle hop could carry you hundreds of meters into the air. Just be careful not to damage your spacesuit on the way down.

        #ASS_JupiterInSpaceLowcrawReport = Jupiter looms so large that we can barely see its edges. Through the porthole, turbulent cloud belts fill the view, packed with countless rapidly spinning storms. \nYou begin to wonder whether our spacecraft can withstand Jupiter's deadly radiation.
        #ASS_JupiterInSpacecrewReport = You gaze at the largest planet in the solar system, taking in its beautiful bands and enormous, rapidly spinning storms as its immense gravity pulls at us. \nThrough the telescope, you watch the four Galilean moons and nearly a hundred smaller moons dance slowly around Jupiter.
        #ASS_JupiterFlyingcrewReport = The crushing gravity pins you to your seat. You feel as though you are sinking into it, and even lifting a hand takes tremendous effort.
        #ASS_JupiterInSpaceLowevaReport = Jupiter is so enormous that it almost looks flat.\nYou turn to watch the storms raging across it, each vast enough to rival Earth in size.
        #ASS_JupiterInSpaceevaReport = Gazing at the gas giant against a backdrop of stars, you feel humanity's smallness and the immensity of the universe. You also notice that Jupiter has a ring, though it is rather faint.
        #ASS_JupiterFlyingevaReport = I think I'm gonna die...
        #ASS_JupiterFlyingLowevaReport = The pressure feels as though it will crush me. The gas around me grows ever denser and hotter. Sunlight cannot penetrate these thick clouds, and I can barely see my hand in front of my face. Only occasional, intense flashes of lightning pierce the darkness. \nFierce winds buffet me, strong enough, it seems, to tear the spacecraft apart. \nAm I going to die? \nNo. I want to go home.
        #ASS_JupiterFlyingcrewReportPR = You notice an unusually large number of storms near Jupiter's poles.
        #ASS_JupiterFlyingcrewReportTB = The surrounding clouds seem to contain water.
        #ASS_JupiterFlyingcrewReportEB = You notice the red band of clouds below moving at an alarming rate.
        #ASS_JupiterFlyingcrewReportEZ = You fly through thick clouds, lit by constant flashes of lightning.
        #ASS_JupiterInSpaceLowevaReportEZ = The cloud belt below churns and flows like a river.
        #ASS_JupiterInSpaceLowevaReportEB = Why are these cloud bands red?
        #ASS_JupiterInSpaceLowevaReportTB = Lightning flashes through the violently churning atmosphere below.
        #ASS_JupiterInSpaceLowevaReportPR = I thought Jupiter had no particularly large storms. Then I saw its poles.
        #ASS_JupiterFlyingevaReportPR = I'm falling into the storm-filled world below. I hope the hurricanes don't tear me apart.
        #ASS_JupiterFlyingevaReportTB = A few drops of water appear on your helmet, then quickly vanish.
        #ASS_JupiterFlyingevaReportEB = The red clouds surrounding me look rather frightening.
        #ASS_JupiterFlyingevaReportEZ = White marshmallows? You reach out, trying to catch a little piece of cloud.

        #ASS_IoInSpaceLowcreawReport = Through the porthole, you can see dozens of active volcanoes slowly oozing lava. Any one of them could erupt at any moment.
        #ASS_IoInSpace = You observe volcanic activity on the moon's surface, with eruptions hurling lava nearly a hundred kilometers into the air.
        #ASS_IoSrfLandedcrewReport = The spacecraft's Geiger counter is clicking frantically. This trip may be dangerous.
        #ASS_IoInSpaceLowevaReport = I feel exhausted. Perhaps I should go back to the spacecraft and get some sleep.
        #ASS_IoInSpaceevaReport = You feel slightly dizzy and have a mild headache. Perhaps you are just coming down with a cold.
        #ASS_IoSrfLandedevaReport = As you move across the surface, your spacesuit's vital-signs monitor sounds its alarm nonstop. Despite the low gravity, your footing feels unsteady, as though you are walking on cotton, and every step takes tremendous effort.
        #ASS_IoSrfLandedcrewReportLavaLake = You realize the spacecraft is close to a volcanic crater. This could be dangerous. \nThrough the porthole, you see lava slowly welling up from the ground nearby. A much larger eruption could happen at any moment.
        #ASS_IoInSpaceLowevaReportLavaLake = Groggy as you are, the sight of the volcano oozing lava below jolts you awake. All you want to do now is get back to the spacecraft and leave this dangerous world.
        #ASS_IoSrfSplashedevaReportLavaLake = Perhaps God will grant me immortality?
        #ASS_IoSrfLandedevaReportLavaLake = You gaze at the nearby volcano with a flicker of fear.
        #ASS_IoSrfLandedcrewReportGouhe = You wonder how this ravine formed.
        #ASS_IoSrfLandedcrewReportHightLands = You dream of reaching out and touching the blue sky, but there is no atmosphere here, so you can only touch the stars.
        #ASS_IoSrfLandedcrewReport = Can you find evidence of water here?
        #ASS_IoSrfLandedcrewReportLowlands = You land on solid ground made of basalt.
        #ASS_IoSrfLandedevaReportGouhe = There are traces of past lava flows.
        #ASS_IoInSpaceLowevaReportGouhe = A ravine catches your eye.
        #ASS_IoInSpaceLowevaReportHightLands = You see several towering peaks.
        #ASS_IoSrfLandedevaReportHightLands = You stand on the summit, gazing at Jupiter looming enormous in the sky.
        #ASS_IoInSpaceLowevaReportLowlands = You observe several extinct volcanoes.
        #ASS_IoSrfLandedevaReportLowlands = You smell sulfur. Are you imagining it?
        #ASS_IoSrfLandedevaReportSouthernLowlands = It may be safe here. There are few signs of geological activity.
        #ASS_IoInSpaceLowevaReportSouthernLowlands = You notice that this region has few volcanoes.

        #ASS_EuropaInSpaceLowcrawReport = The linear patterns in the old records are still recognizable, but more troughs, fractures, and impact scars now remain on the ice. You mark the rougher regions on the map for a closer look.
        #ASS_EuropaInSpacecrewReport = Light and dark patterns cover this giant snowball. Even from this distance, it looks less smooth than it did in the early photographs.
        #ASS_EuropaInSpaceLowevaReport = Complex fractures and scattered impact craters pass below. Compared with older records, more relief remains in the ice; geological activity seems less diligent about resurfacing it now.
        #ASS_EuropaInSpaceevaReport = Europa has a sharp outline, and its extremely thin atmosphere is almost impossible to make out by eye. Long dark markings cross the ice, tempting you to follow them all the way.
        #ASS_EuropaSrfLandedcrewReports = The lander rests on hard, uneven ice. Fractures and broken ice make the surface look rougher than in the old photographs; finding a level parking spot was not easy.
        #ASS_EuropaSrfLandedcrewReportsCraters = Broken ice is exposed in the crater walls, while fine debris covers the floor. The impact outline remains distinct and has apparently not been erased by later geological activity.
        #ASS_EuropaSrfLandedcrewReportsCilff = The fissure stretches into the distance, and the ice on either side appears slightly offset. You record the height and orientation of the scarps for comparison with nearby fractures.
        #ASS_EuropaSrfLandedevaReport = Humanity once dreamed of sending probes to this ice. Now that you stand here, the broken ice and fine fractures beneath your boots look far more intricate than they did from a distance.
        #ASS_EuropaSrfLandedevaReportCraters = The crater walls expose broken ice, and nearby fragments vary in size. You photograph their positions and shapes to compare the distribution of material left by the impact.
        #ASS_EuropaSrfLandedevaReportCilff = The ice breaks away at the edge of the fissure, and the walls appear to show signs of displacement. You mark a safe position so the next crew will remember to watch their footing as well as the view.
        #ASS_EuropaSrfLandedevaReportHightlands = The highland ice is rugged and hard, with a sharp contrast between exposed ridges and shaded ground. You check the fractures underfoot before choosing your next step.
        #ASS_EuropaFlyingevaReportRiverValley = Elongated troughs cross the ice, with similarly shaped scarps along their walls. You record their orientations, wondering whether they formed during the same episode of tectonic activity.
        #ASS_EuropaFlyingevaReportCilff = Scarps and offset ice are clearly visible along the fissures. You record their orientation for comparison with the shapes of nearby troughs.
        #ASS_EuropaFlyingevaReportLake = A broad trough extends below, with broken, uneven ice along its margins. Its shape is consistent with stretching of the ice shell and merits a survey farther along its length.
        #ASS_EuropaFlyingevaReportLowlands = Bright ice and dark debris alternate across the lowlands, with some debris collected in depressions. You mark these locations in the photographs for use during sampling.
        #ASS_EuropaSrfLandedevaReportRiverValley = Fracture surfaces in the trough walls and loose ice on the floor are clearly visible. You follow the more level ground, noting places to compare intact ice with loose deposits.
        #ASS_EuropaSrfLandedevaReportLake = Broken ice and fine dark material lie across the trough floor between uneven ice walls. You follow the level patches, taking care not to disturb the areas selected for sampling.
        #ASS_EuropaSrfLandedevaReportCilff = The ice breaks away at the edge of the fissure, and the walls appear to show signs of displacement. You mark a safe position so the next crew will remember to watch their footing as well as the view.
        #ASS_EuropaFlyingcrewReportLake = A broad trough lies below, with broken ice between its uneven walls. You photograph it along its length to connect this terrain with the existing map.
        #ASS_EuropaFlyingcrewReportRiverValley = You fly along a low-lying trough, with fractures and local collapse visible in its icy walls. Its shape alone does not establish that liquid water once flowed here.
        #ASS_EuropaFlyingcrewReportCilff = Fissures divide the ice into patches of different sizes, with broken margins in places. They preserve traces of past movement in the crust and deserve a closer look.
        #ASS_EuropaFlyingcrewReportLow = You search for a suitable landing site.
        #ASS_EuropaInSpaceLowevaReportLake = A broad depression cuts across the ice, with light and shadow outlining its uneven walls. You log its width and orientation.
        #ASS_EuropaInSpaceLowevaReportCilff = Fissures intersect across the ice, apparently cutting through some smaller features. You photograph the intersections to help establish the order in which the terrain formed.
        #ASS_EuropaInSpaceLowevaReportRiverValley = Troughs form a complex pattern here, with some sections running parallel. You save a complete image sequence for comparison with ice at higher latitudes.
        #ASS_EuropaFlyingevaReport = Fractures in the ice grow clearer, while the suit reports extremely low external pressure. You check the remaining propellant in your jetpack and prepare to return to the spacecraft.
        #ASS_EuropaFlyingcrewReport = From a distance, the ice looks fairly gentle. Up close, fine fractures, scarps, and broken blocks become apparent. You begin looking for a level spot for the lander.
        #ASS_EuropaFlyingevaReportLow = Perhaps returning to the spacecraft is the best choice right now.

        #ASS_GanymedeInSpaceLowevaReport = Pale yellow and darker patches alternate across the frozen surface. You photograph their boundaries for comparison with the surface samples to be collected later.
        #ASS_GanymedeInSpaceevaReport = Jupiter remains a massive presence in the sky.
        #ASS_GanymedeFlyingevaReport = The atmosphere is extremely thin, and the suit reports bitter cold outside. You check the oxygen supply and thermal controls before returning your attention to the approaching ground.
        #ASS_GannedeFlyingLowevaReport = The relief of the ice is clearly visible now, but the thin air provides little drag. You keep an eye on the descent speed; sightseeing will have to wait.
        #ASS_GanymedeSrfLandedevaReport = Your boots crush loose surface grains, but the frozen material beneath remains hard. You follow a nearby fissure, recording where the ice meets darker debris.
        #ASS_GanymedeInSpaceevaReportDaoyu = Isolated highlands below are scattered like islands among lower terrain. You photograph their boundaries and shadows for comparison with elevation data.
        #ASS_GannedeFlyingLowevaReportDaoyu = The thin air makes it difficult to slow down, no matter how you orient yourself.
        #ASS_GanymedeSrfLandedevaReportDaoyu = Debris of different sizes is scattered across this raised patch of frozen terrain. You photograph both a slope and a flatter area to record differences in the distribution of grains.
        #ASS_GannedeFlyingLowevaReportYunJikeng = Unless you look closely, you might never recognize this as an impact crater. It is enormous, and its walls slope so gently.
        #ASS_GanymedeSrfLandedevaReportSPH = A man-made structure! It appears to be abandoned now, covered entirely in moss.
        #ASS_GanymedeSrfLandedevaReportIslandAirfield = This runway looks as though it has been abandoned for a long time.
        #ASS_GanymedeInSpaceLowcrawReport = Patches of light and dark terrain and old impact features spread beneath the porthole. You mark the boundaries between them for comparison with the terrain survey.
        #ASS_GanymedeInSpacecrewReport = An enormous moon, larger even than Mercury. The spacecraft's instruments also detect a weak magnetic field.
        #ASS_GanymedeFlyingcrewReport = The ice and uneven highlands below come into sharper view. Pressure remains very low, so you carefully calculate how much descent speed the thrusters will need to remove before landing.
        #ASS_GanymedeSrfLandedcrewReport = Beyond the porthole, fine debris covers a firmer layer of frozen ground. The landing legs have left shallow impressions, with no liquid flowing around them.
        #ASS_GanymedeSrfLandedcrewReportDaoyu = The raised terrain called an island exposes a firmer surface above the frozen lowlands around it. At least we have found a foothold worth surveying carefully.
        #ASS_GanymedeFlyingcrewReportDaoyu = The isolated high ground has clear boundaries with the surrounding depressions. You photograph the edges to see how their outlines relate to the relief.
        #ASS_GanymedeFlyingcrewReportYunJikeng = Arcing crater rims and broken terrain emerge below. You connect the features in a sketch; the outline left by the impact is clearer than it was from farther away.
        #ASS_GanymedeSrfLandedcrewReportSPH = You have landed on top of the building, but it looks as though it has gone without maintenance for a very long time.
        #ASS_GanymedeSrfLandedcrewReportIslandAirfield = Even though this airfield has been abandoned, our spacecraft is still able to land here.
        #ASS_GanymedeSrfLandedcrewReportlands = Exposed ground on the highlands is interspersed with fine debris, and distant rises interrupt the view. You record the local slope and how far the landing legs have settled.

        #ASS_CallistoInSpaceLowcrawReport = Bright crater rims interrupt the dark terrain below the window, with smaller craters overlapping older outlines. You mark these intersections to compare how well different regions have preserved their surfaces.
        #ASS_CallistoInSpacecrewReport = Callisto looks dim beside the other three Galilean moons. A longer camera exposure reveals scattered bright patches among the dark terrain; this ancient moon still has details worth a closer look.
        #ASS_CallistoFlyingcrewReport = The instruments record a cold, thin atmosphere containing a small amount of oxygen. Crater walls come into focus beyond the window as you log altitude and pressure; the cabin air supply remains essential.
        #ASS_CallistoSrfLandedcrewReport = Dark grains cover the ice outside the window, and fine debris has collected in nearby hollows. You mark a cleaner exposure of ice where the surface coating and the ice beneath could be sampled separately.
        #ASS_CallistoInSpaceLowevaReport = Following the light and dark terrain across the ice, you pick out crater rims, gentle slopes, and long grooves. Their boundaries stand out in oblique sunlight, making this a good opportunity for more terrain photographs.
        #ASS_CallistoInSpaceevaReport = The outlines of large impact structures are still visible from here. You compare their exposed rims with orbital photographs and mark possible sites for a closer visit.
        #ASS_CallistoFlyingevaReport = A thin atmosphere surrounds you, but the suit must still maintain its own pressure and temperature. After checking the life-support readings, you decide to finish the observations from inside the spacecraft.
        #ASS_CallistoFlyingLowevaReport = Ice and debris are now distinguishable on the ground, though shadows conceal some of the slopes inside the grooves. You quickly record the changes in terrain and check your distance from the spacecraft again.
        #ASS_CallistoSrfLandedevaReport = Your boots press into loose grains above very hard ice. The grooves contain shadows and accumulated debris, with no visible flowing water. You photograph the footprints to record how the surface material responds to pressure.
        #ASS_CallistoFlyingLowevaReportisland = Brighter ice is exposed along the edge of the raised terrain, while darker debris gathers at the foot of the slopes. You note the locations for a comparison after landing.
        #ASS_CallistoInSpaceLowevaReportisland = Fine grains cover this raised terrain, and the exposed ice is hard and cold. You examine debris accumulated in nearby grooves and record how its distribution relates to the direction of the slopes.
        #ASS_CallistoInSpaceLowevaReport = Following the light and dark terrain across the ice, you pick out crater rims, gentle slopes, and long grooves. Their boundaries stand out in oblique sunlight, making this a good opportunity for more terrain photographs.
        #ASS_CallistoFlyingcrewReportisland = Low-lying terrain surrounds this raised tract, with slopes and grooves visible along its margins. You photograph the outline to assemble a map of its relief.
        #ASS_CallistoInSpaceLowcrawReportisland = Magnifying a dark patch on the ice reveals an uneven boundary and a texture different from the surrounding terrain. You mark the area for a closer survey before selecting a sampling site.

        #ASS_SaturnInSpaceLowcrawReport = You notice delicate white clouds in the atmosphere below. Powerful hurricanes stretch them out until they finally disperse.
        #ASS_SaturnInSpacecrewReport = Saturn's vast, bright E and G rings are beautiful. Even without its main rings, it is still the most beautiful planet in the solar system.
        #ASS_SaturnFlyingcrewReport = The temperature around us is rising.
        #ASS_SaturnInSpaceLowevaReport = Perhaps it is not as beautiful as Jupiter. Its atmosphere looks rather plain, without any long-lived cloud formations.
        #ASS_SaturnInSpaceevaReport = You see an enormous pale blue ring, glowing with beautiful colors in the sunlight. You cannot help reaching out to touch it.
        #ASS_SaturnFlyingLowevaReport = The pressure around you rises rapidly, and the temperature climbs with it. Your spacesuit is nearing its limits.
        #ASS_SaturnFlyingevaReport = Even with your suit's cooling turned all the way up, the temperature keeps climbing. Then you notice what looks like a hairline crack in your helmet.
        #ASS_SaturnFlyingcrewReportEB = The clouds around you seem more reflective. They are dazzlingly bright.
        #ASS_SaturnFlyingcrewReportTB = A few white clouds nearby look very much like those back home.
        #ASS_SaturnInSpaceLowevaReportPR = From here, you may be able to see Saturn's enormous outer rings clearly as they reflect the sunlight.
        #ASS_SaturnInSpaceLowevaReportEB = Where are the rings of Saturn?
        #ASS_SaturnFlyLowevaReportTB = White clouds churn around you, lit by occasional flashes of lightning... \nBelow, there is no land in sight, only endless clouds. Their shapes seem to change as you descend.

        #ASS_MinasInSpaceLowcreawReport = Through the porthole, you study the details of Mimas's surface: a parched, lifeless world. \nIt has lost all its water and ice.
        #ASS_MinasInSpace = That enormous impact crater may date back tens of billions of years, to when Mimas was still forming. It reaches deep into the moon's mantle.
        #ASS_MinasSrfLandedcrewReport = Outside the porthole, small, sharp stones litter the ground. They pose little threat to the spacecraft, but could make any excursion outside hazardous.
        #ASS_MimasInSpaceLowevaReport = The terrain looks very uneven. If you need to land, that enormous crater may be your best option.
        #ASS_MimasInSpaceevaReport = The moon looks distinctly flattened, its surface marked by an enormous crater, numerous fractures, and many peaks.
        #ASS_MimasSrfLandedevaReport = You take each step carefully. A fall onto these sharp rocks could tear your spacesuit and let your oxygen escape.

        #ASS_SaturnIIInSpaceLowcreawReport = You feel a pang of regret. Back when the Sun was a main-sequence star, Enceladus had a subsurface ocean that might have supported life. That promising ocean met an early end.
        #ASS_SaturnIIInSpace = A traveler from the distant past would never recognize this as Enceladus, once considered one of the moons most likely to harbor life. \n\nWhen it lost its ice, Saturn's E ring lost its source of fresh icy material... For tens of billions of years, this moon gave so much to that ring...
        #ASS_SaturnIISrfLandedcrewReport = Perhaps we could go outside and find traces of the ancient ocean. If life ever existed there, we might even find fossils.
        #ASS_SaturnIIInSpaceLowevaReport = Strange formations and canyons cover the world below. They may once have lain beneath an ancient ocean.
        #ASS_SaturnIIInSpaceevaReport = Dull and faded... Like a sorceress suddenly stripped of her magic, revealing ten billion years of wear.
        #ASS_SaturnIISrfLandedevaReport = You stand on the bed of an ancient ocean that once lay beneath tens of kilometers of ice. It must have been so dark down here... If anything lived in those waters, what might it have looked like?
        #ASS_SaturnIISrfLandedevaReportWD = This area looks flat. What was it once? An ancient abyssal plain?
        #ASS_SaturnIISrfLandedevaReportciff = These strange cracks don't seem very deep.

        #ASS_SaturnIIIInSpaceLowcreawReport = This small body is bright. As your spacecraft crosses its sunlit side, it is best not to look directly at the surface.
        #ASS_SaturnIIIInSpace = A snowball in space! \nFrom a distance, it looks smooth, with no craters or mountains, only a few strange rift valleys.
        #ASS_SaturnIIISrfLandedcrewReport = You sense some gas being released from the ice below you, perhaps due to continued sublimation.
        #ASS_TethysInSpaceLowevaReport = Staring at the world below for too long might give you snow blindness. \nYou study its many fractures, hoping to spot something interesting.
        #ASS_TethysInSpaceevaReport = From this height, Tethys looks like a giant white snowball, with almost no features you can distinguish. Your vision seems to blur as you gaze at it.
        #ASS_TethysevaSrfLanded = Once you reach the surface, you find that it is far from smooth. Gravel litters the ground, which is riddled with tiny cracks barely wide enough to fit a finger.

        #ASS_DioneInSpaceLowcreawReport = Wearing your sunglasses, you study the countless strange streaks on the icy world below. It almost seems to be giving off "mist."
        #ASS_DioneInSpace = The terrain looks remarkably flat. From a distance, the moon seems smooth, with hardly a crater in sight.
        #ASS_DioneSrfLandedcrewReport = Gas appears to be escaping from the distant rift.
        #ASS_DioneInSpaceLowevaReport = You look up at the stars and watch nearly a hundred tiny dots orbiting Saturn. \nThen you turn back to Saturn itself. You can barely recognize it anymore.
        #ASS_DioneInSpaceevaReport = It seems to have an extremely thin atmosphere, so tenuous that it is almost a vacuum.
        #ASS_DioneevaSrfLanded = You walk across the ice, taking each step with care, as you don't know if there are cavities beneath the ice.
        #ASS_DioneInSpaceLowevaReportYWK = You spot a circular depression below: a lonely crater, one of the few on this moon.
        #ASS_DioneInSpaceLowevaReportPY = That plain looks nice and flat. Perhaps we could go skiing. What would skiing in such low gravity be like?
        #ASS_DioneevaSrfLandedPY = You imagine having a pair of enormous ice skates made to fit over your bulky spacesuit boots, then heading out onto the ice.
        #ASS_DioneevaSrfLandedXG = A canyon, one of many on this frozen world. It seems fairly unremarkable.

        #ASS_RheaInSpaceLowcreawReport = You notice flashes below and begin recording how often they occur.
        #ASS_RheaInSpace = You remember a rumor from elementary school: Rhea has a ring. Now you can finally check for yourself... \nThere does not seem to be a ring after all...
        #ASS_RheaSrfLandedcrewReport = It looks desolate, yet somehow full of promise. The spacecraft's sensitive instruments detect oxygen in this tiny moon's atmosphere, despite a pressure of only a few millipascals... \n\nWell, that is not much use to us...
        #ASS_RheaInSpaceLowevaReport = You study the dense network of fractures below. They seem to vent gas in a regular pattern as the icy moon rotates.
        #ASS_RheaInSpaceevaReport = Well, there does not seem to be a ring. You turn away to gaze into the vast starry sky...
        #ASS_RheaevaSrfLanded = At noon, sunlight reflects so brightly off the ice that you cannot make out details such as rocks or gullies. Perhaps it is best to wait until the Sun is lower before venturing outside.
        #ASS_RheaFlyingcrewReport = Some of the terrain below looks strangely wrinkled, like an elderly person's skin.
        #ASS_RheaFlyingcrewReportLow = Staring at the ground for too long could cause snow blindness. That would make it dangerously easy to misjudge your altitude and crash into the terrain.
        #ASS_RheaFlyingcrewReportLowYSK = Could that feature outside the window be an impact crater?
        #ASS_RheaFlyingcrewReportLowCliff = The rift valley below is filled with small fragments of ice. As you approach, their odd shapes seem to make them flash in a regular pattern, almost like signals in Morse code.
        #ASS_RheaFlyingevaReport = You had better be careful to avoid a hard landing.
        #ASS_RheaFlyingLowevaReport = Sharp chunks of ice and loose stones litter the ground. Watch your step.
        #ASS_RheaFlyingevaReportYSK = It's quite rare to find a crater on such an icy world.
        #ASS_RheaFlyingevaReport = The lower temperatures in this frozen world's polar regions may slow the sublimation of its ice... Even so, against the dark background, you can still make out a faint cloud of mist slowly escaping in the distance.

        #ASS_TitanSurfSample = "You crouch down to inspect the ground. Small blades of grass grow in the damp soil. You scoop up a handful of earth, complete with an unfamiliar young plant." Of course, this is all just your imagination...
        #ASS_TitanSurfSampleHighlands = You brush aside the yellow sand to find ground beneath it that has not yet fully thawed.
        #ASS_TitanSurfSampleLowlands = The soil contains tiny ice crystals and a little water. It seems little changed from more than six billion years ago.
        #ASS_TitanSurfSampleHills = You find large, yellow-green stones in the soil of this hill. They are shaped like disks.
        #ASS_TitanSurfSampleSouthernhills = Deep below the surface, the soil seems to be dark gray. It clings to your white gloves.
        #ASS_TitanSurfSampleNorthernhills = "This wet soil seems full of moss. It feels rather disgusting in my hands." You consider reporting this to the commander, then think better of it. You might end up in a psychiatric hospital after the mission.
        #ASS_TitanSurfSampleSoutherndelta = You search the soil for evidence of microorganisms.
        #ASS_TitanInSpaceLowevaReport = Floating in orbit nearly a hundred kilometers above Titan, you look down to see broad river channels, vast lakes, landmasses blanketed in white, and slow-drifting clouds. Only a hundred-kilometer-thick atmosphere separates you from the moon below—the final stretch of a journey spanning nearly a billion kilometers.
        #ASS_TitanInSpaceevaReport = You drift through empty space, overwhelmed by loneliness. "Light Years Away" plays in your headphones, and the song seems to capture exactly how you feel. Before long, you find yourself humming along.
        #ASS_TitanFlyingevaReport = This is getting dangerous.
        #ASS_TitanFlyingLowevaReport = This is very dangerous.
        #ASS_TitanSrfLandedevaReport = You look up at the enormous mushroom, tempted to run over and take a bite to see if it is edible.
        #ASS_TitanSrfLandedevaReportCoolWater = The soil bears abundant traces of flowing methane. Water squeezes out with every step, leaving your boots filthy.
        #ASS_TitanInSpaceLowevaReportCoolWater = Is that water?
        #ASS_TitanFlyingLowevaReportCoolWater = Perhaps the soft mud could cushion much of the impact.
        #ASS_TitanInSpaceLowcrawReport = From your spacecraft in orbit around Titan, you watch this beautiful, distant world slowly roll beneath you. You cannot make out any artificial structures from this altitude; they are all too small.
        #ASS_TitanInSpacecrewReport = From this altitude, you can see all of Titan: vast landmasses crossed by several rivers. Of course, those rivers dried up long ago.
        #ASS_TitanFlyingcrewReport = We are flying through Titan's atmosphere, which seems to be twice as dense as our home planet's. You may need considerable thrust to fly fast. At this altitude, it feels as though you could reach out and touch the sky.
        #ASS_TitanSrfLandedcrewReport = You look out at a cold, desolate desert dotted with just a few giant mushrooms. They are astonishingly large, reaching nearly a hundred meters tall.
        #ASS_TitanSrfLandedcrewReportCoolWater = The spacecraft seems to be listing. Has it sunk into the mud?

        #ASS_IapetusInSpaceLowcreawReport = The Sun has erased its old features, leaving it seemingly rejuvenated. You begin studying the strange ravines and glaciers on its surface.
        #ASS_IapetusInSpace = Iapetus is the farthest of Saturn's spherical moons. Even at this distance, it remains tidally locked to Saturn, making it seem as though it does not rotate at all.
        #ASS_IapetusSrfLandedcrewReport = You gaze out the window at the stars. This frozen world rotates so slowly that even a photograph exposed for hours would show no star trails.
        #ASS_IapetusInSpaceLowevaReport = You turn to look at Saturn. With hundreds of moons, this planetary system resembles a miniature solar system...
        #ASS_IapetusInSpaceevaReport = What discoveries await us on this frozen world?
        #ASS_IapetusevaSrfLanded = You stand on this strange alien world, feeling a sense of unease.
        #ASS_IapetusevaSrfLandedCDSM = This mountain range seems more like part of a vast ravine. You will have to tread carefully on such treacherous terrain.
        #ASS_IapetusevaSrfLandedJD = You scan the sky with your telescope, trying to spot Saturn's other moons.
        #ASS_IapetusInSpaceLowcreawReportCliff = These ravines look spectacular from space. You begin imagining what they would look like filled with water.
        #ASS_IapetusSrfLandedcrewReportCliff = You had better make sure the spacecraft has come to a secure stop.

        #ASS_UranusInSpaceLowcrawReport = A vast white cloud covers the north pole of Uranus like an enormous ice cap. \nThe world seems eerily still, with almost no cyclones in the clouds below.
        #ASS_UranusInSpacecrewReport = The long voyage has left you exhausted and tense, but the first sight of Uranus washes it all away. You can no longer remember how long you have been traveling through the darkness since leaving home.
        #ASS_UranusFlyingcrewReport = Gravity presses you firmly into your seat. After a while, you adjust and realize it is not actually all that strong.
        #ASS_UranusSrfSplashedcrewReport = The liquid outside the window is strange. It is water, yet it looks nothing like ordinary water, and it is remarkably dense. Even your heavy spacecraft floats on it.
        #ASS_UranusSrfLandedcrewReport = Our descent seems to have reached a balance with gravity. We have, in a sense, "dived" into the interior of this ice giant. The pressure outside the cabin is staggering, threatening to crush the spacecraft.
        #ASS_UranusInSpaceLowevaReport = The sight of Uranus below fills you with excitement. Years of exhaustion from the long, monotonous voyage seem to vanish in an instant.
        #ASS_UranusInSpaceevaReport = Sunlight gives this beautiful gas planet a lovely blue-white glow. \nYou also notice that Uranus has a ring, though it is faint and dim.
        #ASS_UranusFlyingLowevaReport = This is very dangerous.
        #ASS_UranusFlyLowevaReport = I think it is time to get back inside the spacecraft, or I may never make it home.
        #ASS_UranusevaSrfLanded = For some reason, you feel deeply uneasy here, almost as though you have no body. Even in your bulky spacesuit, you feel strangely weightless.
        #ASS_UranusFlyingcrewReportEye = A vast black hole seems to have opened in the blue clouds.
        #ASS_UranusFlyingcrewReportSPB = The surrounding clouds are very bright.
        #ASS_UranusInSpaceLowevaReportSPB = It looks like an enormous ice cap.
        #ASS_UranusInSpaceLowevaReportSPB = Quick, look! Uranus has a giant eye!
        #ASS_UranusFlyLowevaReportEye = It feels as though I am falling into a black hole instead of Uranus.
        #ASS_UranusInSpaceLowevaReportSPB = Objects of all sizes strike your helmet. You realize it is raining diamonds.

        #ASS_MirandaInSpaceLowcreawReport = You spot an exceptionally tall cliff on the surface. What a place to go skydiving!
        #ASS_MirandaInSpace = Look, it is Miranda!
        #ASS_MirdandaSrfLandedcrewReport = You eagerly grab a parachute, ready to head for Verona Rupes and jump. \nOnly when you open the hatch do you realize that this frozen world has no atmosphere.
        #ASS_MirandaInSpaceLowevaReport = With gravity this low, perhaps it is safe.
        #ASS_MirandaInSpaceevaReport = You gaze at Verona Rupes and estimate that the towering cliff must be at least 20 kilometers high.
        #ASS_MirandaevaSrfLanded = Gravity is so weak that even a small hop sends you tens of meters above the ground. If this world had an atmosphere, skydiving here would be incredible.

        #ASS_ArielInSpaceLowcreawReport = A bold idea suddenly occurs to you: perhaps you could land here and return to orbit using only your jetpack.
        #ASS_ArielInSpace = Even from a distance, this gray moon looks anything but smooth. Its surface is riddled with canyons and craters.
        #ASS_ArielSrfLandedcrewReport = The spacecraft touches down on the slippery surface, slides a short distance, and comes safely to a stop.
        #ASS_ArielInSpaceLowevaReport = Perhaps you could land using only your jetpack? No one has managed it yet.
        #ASS_ArielInSpaceevaReport = Could mixtures of ice and water erupt from its cracks, as they do on Enceladus?
        #ASS_ArielevaSrfLanded = You look up at the stars, trying to find your home planet.

        #ASS_UmbrielInSpaceLowcreawReport = It looks rather dull. You can barely make out any features in the gray landscape.
        #ASS_UmbrielInSpace = Two craters filled with white material catch your eye. They look like a pair of eyes staring straight at you.
        #ASS_UmbrielSrfLandedcrewReport = A thick layer of dust seems to cover the surface. Your landing engines blasted some of it upward, and it is now settling slowly. A fair amount lands on the spacecraft, leaving it looking decidedly dirty.
        #ASS_UmbrielInSpaceLowevaReport = You notice that this "moon" looks grayer than the other four moons.
        #ASS_UmbrielInSpaceevaReport = Perhaps a thick coating of dust is what makes this frozen moon look so dirty.
        #ASS_UmbrielevaSrfLanded = Your boots leave distinct footprints on the surface.

        #ASS_Titania114514 = The strange whitish landforms catch your eye, but you cannot tell how they formed.
        #ASS_Titania114514 = The north and south polar regions seem whiter and brighter than the terrain near the equator.
        #ASS_Titania114514 = Uranus hangs overhead like an enormous moon, glowing a deep blue in the sunlight.
        #ASS_TitaniaFlyingLowevaReport = A frigid red desert.
        #ASS_TitaniaFlyLowevaReport = White material seems to cover the distant slopes, making them paler than the ground at the foot of the mountains.
        #ASS_TitaniaInSpaceLowcreawReport = The world below reflects an unsettling reddish-brown hue in the sunlight.
        #ASS_TitaniaInSpace = You spot several vast white patches on the surface, but cannot tell whether geological activity formed them.
        #ASS_TItaniaSrfLandedcrewReport = Only after landing do you discover that this world has an atmosphere. It is so thin that you initially suspect an error in the onboard computer.
        #ASS_TitaniaFlyingcrewReport = The red world below looks far warmer than it really is.

        #ASS_OberonInSpaceLowcreawReport = Several enormous craters below suggest that this moon once suffered tremendous impacts.
        #ASS_OberonInSpace = The north polar region of this icy moon seems brighter than the rest of the surface, like a vast ice cap.
        #ASS_OberonSrfLandedcrewReport = Beyond the window lies a frigid red desert dotted with strange boulders.
        #ASS_OberonInSpaceLowevaReport = The ice sheet below has an eerie red tint, as though stained with blood.
        #ASS_OberonInSpaceevaReport = A dull, lifeless world.
        #ASS_OberonevaSrfLanded = You step onto the frozen desert, leaving a clear footprint with every step.

        #ASS_NeptuneInSpaceLowevaReport = You notice numerous pieces of space debris racing around Neptune in very low orbits.
        #ASS_NeptuneInSpaceevaReport = Floating in empty space, you gaze down at the immense ice giant and spot a vast cyclone in Neptune's clouds.
        #ASS_NeptuneFlyingLowevaReport = I cannot see through this fog! This is dangerous!
        #ASS_NeptuneFlyLowevaReport = This is dangerous!
        #ASS_NeptuneevaSrfLanded = You stand on Neptune's icy shell as winds blow past at several times the speed of sound. Overhead, lightning flashes almost continuously through the thick clouds, lighting up the darkness below.
        #ASS_NeptuneSrfSplashedevaReport = The liquid below seems strange: it looks like water, yet somehow does not.
        #ASS_NeptuneInSpaceLowcrawReport = Through the window, you watch the violent atmospheric activity on Neptune below.
        #ASS_NeptuneInSpacecrewReport = You have lost track of how long you have been traveling alone through this empty universe.
        #ASS_NeptuneFlyingcrewReport = Let us hope the hurricane does not tear the spacecraft apart.
        #ASS_NeptuneSrfSplashedcrewReport = The liquid outside the window is strange. It is water, yet it looks nothing like ordinary water, and it is remarkably dense. Even your heavy spacecraft floats on it.
        #ASS_NeptuneSrfLandedcrewReport = You have landed on Neptune's icy shell, but the entire spacecraft still seems to be shaking.
        #ASS_NeptuneInSpaceLowevaReporImpontiStormEyet = The immense cyclone below looks as though it could suck us in.
        #ASS_NeptuneFlyLowevaReportImpontiStormEye = The winds around you are growing stronger and stronger.
        #ASS_NeptuneFlyingLowevaReportImpontiStormEye = Intense lightning flashes around the storm.
        #ASS_NeptuneevaSrfLandedImpontiStormEye = The enormous storm overhead seems to devour everything like a black hole.
        #ASS_NeptuneFlyingcrewReportImpontiStormEye = As you fly through the immense storm, hurricane-force winds shake the spacecraft violently.
        #ASS_NeptuneSrfLandedcrewReportImpontiStormEye = Through the window, you watch the enormous storm spinning rapidly overhead, surrounded by intense lightning.
        #ASS_NeptuneFlyingcrewReportImpontiStormEye = As you fly through the immense storm, hurricane-force winds shake the spacecraft violently.
        #ASS_NeptuneSrfLandedcrewReportImpontiStormEye = Through the window, you watch the enormous storm spinning rapidly overhead, surrounded by intense lightning.
        #ASS_NeptuneInSpaceevaReportWC = You spot a white cloud drifting through Neptune's atmosphere below and wonder what it is made of.
        #ASS_NeptuneFlyLowevaReportWC = They seem to be made of water vapor.
        #ASS_NeptuneFlyingcrewReportWC = Look at those white clouds outside the window! Who would have expected to see them on a gas planet?
        #ASS_NeptuneInSpaceLowevaReportPB = Look, clouds!

        #ASS_TritonInSpaceLowcrawReport =   Broad ice plains fill the view below, with reflections from liquid surfaces in only a few depressions. You mark these scattered liquid-nitrogen lakes and look for a small group close enough to survey in one excursion.
        #ASS_TritonInSpacecrewReport =      Most of Triton remains frozen, with smooth expanses alternating with rougher terrain. Its few liquid-nitrogen lakes are difficult to distinguish at this distance, so you begin by mapping the wider landscape.
        #ASS_TritonFlyingcrewReport =       The thin atmosphere still affects the flight path. Through the window, you search depressions in the ice plains, marking possible lake reflections separately from stationary patches of bright ice.
        #ASS_TritonSrfSplashedcrewReport =  The spacecraft rests in a liquid-nitrogen lake, with its shore and the broad, solid ice plain visible beyond. You record the hull motion and the temperature change after contact with the liquid. This small lake deserves a map of its own.
        #ASS_TritonSrfLandedcrewReport =    The ground outside is hard and cold, with a thin covering of darker debris over the ice. You mark nearby low ground for the next survey, hoping to find traces of the few lakes scattered across the plains.
        #ASS_TritonInSpaceLowevaReport =    From outside the spacecraft, smooth ice plains cover far more ground than the lakes. You compare orbital photographs, tracing a few neighboring dark patches and recording how their reflections change with viewing angle to help identify the lakes.
        #ASS_TritonInSpaceevaReport =       You trace the light and shadow, picking out raised terrain and the even outlines of the ice plains. The small lakes remain below your resolving power; the search will continue closer to the moon.
        #ASS_TritonFlyingLowevaReport =     Small rises in the ice are now visible, but a possible shoreline still needs a closer inspection. You note its position and check your distance from the spacecraft again; the survey needs to leave room for the return trip.
        #ASS_TritonFlyLowevaReport =        Cold, thin gas flows around the suit, with broad ice plains below. You record the visible depressions and slopes, looking for places that merit a landing survey.
        #ASS_TritonevaSrfLanded =           A thin layer of grains brushes aside easily, exposing ice as hard as rock. You record changes in color and texture while following the low relief in search of a shoreline. The suit insulation gets no respite.
        #ASS_TritonSrfSplashedevaReport =   Liquid nitrogen contacts the outer suit, and a temperature alarm draws your attention to its seams and seals. Secured beside the spacecraft, you record the contact between the lake liquid and the shoreline ice and finish the observation promptly.

        #ASS_NereidInSpacecrewReport = You examine this enormous rock through a telescope and spot several exceptionally large craters.
        #ASS_NereidInSpaceLowcrawReport = The world below looks much like any other asteroid, with rocks scattered across its surface. The only difference is that the ground seems brighter.
        #ASS_NereidSrfLandedcrewReport = This moon is not tidally locked. Watch the distant horizon, and you can see both the Sun and Neptune rise and set.
        #ASS_NereidSrfLandedcrewReportCraters = You have landed inside one of the larger craters, perhaps the scar of a tremendous impact. Only from within do you appreciate how vast and deep it is.
        #ASS_NereidSrfLandedcrewReportHighlands = Strictly speaking, this hardly qualifies as a "mountain."
        #ASS_NereidInSpaceevaReport = This little rock has a surprisingly smooth surface. Only a few enormous craters interrupt it, looking strangely out of place.
        #ASS_NereidInSpaceevaReportLow = The ice below reflects the faint sunlight. For such a small body, it seems remarkably bright.
        #ASS_NereidInSpaceevaReportLowCraters = The enormous craters fill you with unease. They seem to cut deep into the crust, perhaps even reaching the mantle.
        #ASS_NereidevaSrfLanded = The Sun offers little warmth. Its feeble light reflects off the distant horizon, creating a strange sight.
        #ASS_NereidevaSrfLandedCraters = There seems to be nothing unusual in this crater, apart from all the loose rock. One careless step could send you tumbling onto a sharp stone and puncture your helmet.

        #ASS_NesoInSpaceevaReport = At first glance, you would take it for an asteroid. It is hard to believe this is one of Neptune's moons.
        #ASS_NesoInSpaceevaReportLow = You can make out only a handful of large craters, along with towering "mountains" that owe their height to the weak gravity.
        #ASS_NesoevaSrfLanded = Every step is a struggle in this weak gravity.
        #ASS_NesoevaSrfLandedHighlands = You scan the stars for Neptune, but no matter how hard you look, you cannot see it.
        #ASS_NesoevaSrfLandedCraters = Perhaps this moon is simply a lonely traveler accompanying Neptune on its journey around the Sun.
        #ASS_NesoInSpaceevaReportLowHighlands = Wait, is that an enormous mountain?
        #ASS_NesoInSpaceevaReportLowMidlands = You search for something unusual.
        #ASS_NesoInSpacecrewReport = Our average distance from Neptune is almost a third of the distance between Mercury and the Sun. You begin to appreciate just how far from Neptune this moon really is.
        #ASS_NesoInSpaceLowcrawReport = You have confirmed that it is not tidally locked to Neptune, but still wonder why it rotates so slowly.
        #ASS_NesoSrfLandedcrewReport = Deploying a ground anchor may be the best way to keep the spacecraft firmly on the surface.
        #ASS_NesoSrfLandedcrewReportHighlands = You point your telescope into the darkness, searching for Neptune.
        #ASS_NesoSrfLandedcrewReportLowlands = The distant hills look perfectly smooth, reflecting starlight like mirrors.
        #ASS_NesoSrfLandedcrewReport = You cannot wait to get out of the spacecraft and hold a high jump competition.

        #ASS_PlutoInSpaceLowcrawReport = You spot the enormous heart in Pluto's southern hemisphere: its way of declaring its love for Charon.
        #ASS_PlutoInSpacecrewReport = These inseparable companions dance around each other as they orbit the Sun in the distant Kuiper Belt, with four smaller followers in tow.
        #ASS_PlutoFlyingcrewReport = You spot strange tracks on the frozen world below, as though a car had driven across sand.
        #ASS_PlutoSrfLandedcrewReport = Through the window, you see the enormous companion Charon hanging in the sky. You cannot wait to get outside; you have lost track of how long you have been aboard.
        #ASS_PlutoInSpaceLowevaReport = Pluto looks cute.
        #ASS_PlutoInSpaceevaReport = From here, the Sun's light is much gentler. It no longer dazzles your eyes.
        #ASS_PlutoFlyingLowevaReport = "We are mayflies between heaven and earth, a single grain upon the boundless sea. We mourn the brevity of our lives and envy the endless flow of the Yangtze."
        #ASS_PlutoFlyLowevaReport = For a moment, you grasp the vastness of the universe and the wonder of life.
        #ASS_PlutoevaSrfLanded = You look up at a brilliantly starry sky. Around the Sun, a nebula glows a deep red, slowly expanding outward.
        #ASS_PlutoevaSrfLandedTombaughRegio = You notice that the terrain here is relatively flat.
        #ASS_PlutoInSpaceLowevaReportTombaughRegio = A huge heart.
        #ASS_PlutoFlyingLowevaReportTombaughRegio = Suddenly, you think you spot a red sculpture of a human face on the ground.
        #ASS_PlutoFlyingevaReportTombaughRegio = You study the heart-shaped plain below, hoping to discover something.
        #ASS_PlutoFlyingcrewReportTombaughRegio = Through the window, you gaze across an endless white tundra.
        #ASS_PlutoSrfLandedcrewReportTombaughRegio = The tundra outside the window constantly releases gas, perhaps nitrogen.
        #ASS_PlutoFlyLowevaReportSolitudeisland = You think you spot a strange structure among the southern hills. It looks like a red mound.
        #ASS_PlutoevaSrfLandedSolitudeisland = Many mountain ranges cover this area, though they are low and dark in color.
        #ASS_PlutoInSpaceLowevaReportSolitudeisland = From here, you can see numerous mountains below.
        #ASS_PlutoFlyingcrewReportSolitudeisland = The hills below look very dark, with a reddish tint. Could methane be responsible?
        #ASS_PlutoSrfLandedcrewReportSolitudeisland = Low gray hills stretch into the distance beyond the window.
        #ASS_PlutoFlyingcrewReportBaiJiLake = Suddenly, you spot something alarming: a car beside the crater below!
        #ASS_PlutoInSpaceLowcrawReportBaiJiLake = The nitrogen ice in the crater below glitters like crystal in the sunlight.
        #ASS_PlutoSrfLandedcrewReportBaiJiLake = The world outside is captivating. Ice on the ground reflects the sunlight in a pale blue glow that shines through the window into the spacecraft.
        #ASS_PlutoInSpaceLowevaReportBaiJiisland = A careful look through your telescope confirms it: there really is a car on the surface of Pluto.
        #ASS_PlutoFlyingLowevaReportBaiJiisland = You look around, trying to find something.
        #ASS_PlutoevaSrfLandedBaiJiisland = A small hole in the ground nearby seems to be slowly venting gas.
        #ASS_PlutoSrfSplashed = Your sample confirms that this is liquid methane, though it seems highly unstable.
        #ASS_PlutoSrfSplashedevaReport = The weak gravity here allows you to float in the methane.
        #ASS_PlutoSrfSplashedcrewReport = Perhaps conditions inside this crater raise the pressure and temperature just enough for liquid methane to exist here. It seems unstable, though. Clouds of vapor rise from the liquid. It is boiling.

        #ASS_CharonInSpaceLowevaReport = Pluto looks cute.
        #ASS_CharonInSpaceevaReport = You watch silently as the two bodies orbit each other, bound by gravity. For a moment, you feel removed from the rest of the universe.
        #ASS_CharonevaSrfLanded = Standing on this world and gazing at the distant stars, you lose all sense of time. It no longer seems to flow in only one direction. Suddenly, you glimpse your own future: an accident on the journey home, ending in your death during atmospheric reentry at your home planet.
        #ASS_CharonInSpaceLowcrawReport = It looks a little whiter than Pluto. Perhaps there is more snow on its surface.
        #ASS_CharonInSpacecrewReport = Charon seems to be telling Pluto, "Pluto, I love you so much. You can tell, right?"
        #ASS_CharonSrfLandedcrewReport = You grab a sled and open the hatch, eager to head outside and slide down the snow.
        #ASS_CharonInSpaceLowevaReportShooterscanyon = You spot a strange fluorescent object glowing golden yellow on Charon's surface.
        #ASS_CharonSrfLandedcrewReportShooterscanyon = You scan the view through the window. Where did that strange boulder you just saw go?

        #ASS_ErisInSpaceLowcrawReport = It is hard to believe temperatures like these exist so far from the Sun.
        #ASS_ErisInSpacecrewReport = You seem to be testing the limits of a natural lifespan.
        #ASS_ErisFlyingcrewReport = The incredible cold of the world below threatens to make the spacecraft's metal brittle.
        #ASS_ErisSrfSplashedcrewReport = The spacecraft has landed on a sea of liquid nitrogen. You may want to leave quickly; even the strongest metals become brittle in such extreme cold.
        #ASS_ErisSrfLandedcrewReport = The spacecraft touches down on the frigid ground. The heaters switch on to keep the fuel from freezing. Meanwhile, the window fogs over so heavily that no amount of wiping seems to clear it.
        #ASS_ErisInSpaceLowevaReport = You stare in dread at the world below. It is so cold that even nitrogen freezes solid.
        #ASS_ErisInSpaceevaReport = You look from this dwarf planet in the scattered disk back toward the Sun. It now seems about as bright as the full Moon once looked from Earth.
        #ASS_ErisFlyingLowevaReport = Condensation forms on the outside of your visor and freezes, severely obscuring your view.
        #ASS_ErisFlyLowevaReport = The extreme temperature difference causes ice to slowly form on your spacesuit.
        #ASS_ErisevaSrfLanded = You take your first step onto this bitterly cold world. Looking back at the spacecraft, you watch gas from its engines quickly freeze into solid particles and fall to the ground.
        #ASS_ErisSrfSplashedevaReport = You put on a special spacesuit and try to swim, but the liquid is so low in density that you keep sinking.

        #ASS_DysomiaLandedNorthernMidlands = In the faint sunlight, you can see gas slowly escaping from the ground. You hope your eyes are not playing tricks on you.
        #ASS_DysnomiaInSpaceLowcrawReport = As your eyes adjust to the dim light, the dark world below gradually comes into focus.
        #ASS_DysnomiaInSpacecrewReport = A pitch-black "moon."
        #ASS_DysnomiaevaSrfLanded = Even with your heater turned all the way up, you can still feel the cold.
        #ASS_DysnomiaInSpaceLowevaReport = Compared with Eris, this moon reflects so little light that it looks as black as coal.
        #ASS_DysnomiaInSpaceevaReport = You spot several brief flashes of light.

        #ASS_P9InSpaceLowcrawReport = The planet outside the window must be one of the most mysterious worlds in our solar system. Countless white clouds dot its deep blue face, looking just like the clouds back home. You take out your telescope and begin searching for its moons.
        #ASS_P9InSpacecrewReport = A dim world appears outside the window. You have lost track of how long you have been away. You miss the warm breezes, the sea, and the familiar scents of home, and wonder how long it will be before you return.
        #ASS_P9FlyingcrewReport = Strange noises outside the spacecraft make you uneasy. Could such extreme cold cause metal fatigue?
        #ASS_P9FlyingcrewReportBC = You steer toward the white clouds. Long and slender, they stand out sharply against the deep blue background, almost seeming to glow.
        #ASS_P9InSpaceLowevaReport = You turn to look back at the Sun. It is barely distinguishable from the other stars, its light yellow and feeble...
        #ASS_P9InSpaceevaReport = Is that a planet? Even as your eyes adjust to the darkness, you struggle to make out its shape. You may need an infrared camera to photograph it.
        #ASS_P9FlyLowevaReport = Ice cold... Chilled to the bone...
        #ASS_P9FlyLowevaEye = The clouds ahead spin rapidly. The hurricane feels ready to sweep you away.
        #ASS_P9FlyLowevaBB = Could those clouds below contain ice crystals? They look brighter than the clouds elsewhere.
        #ASS_P9InSpaceLowevaReportEye = The enormous storm below turns slowly, like a black hole swallowing everything and spreading darkness.
        #ASS_P9InSpaceLowevaReportBC = Those white clouds may be made of ice, just like the clouds back home. Here, though, that ice is frozen methane and ammonia.
        #ASS_P9InSpaceLowevaReportPolar = As you pass over the poles, you notice no auroras. That makes sense: the planet lies so far from the Sun that it is beyond the heliopause, out of reach of the solar wind.
        #ASS_P9FlyLowevaReportPolar = Is Red Bull sponsoring this adventure?
        #ASS_P9FlyingcrewReport = Neither your infrared nor your ultraviolet spectrometers find any evidence of auroras on this planet.
        #ASS_P9FlyingcrewReportDB = You gaze through the window into the deep, dim clouds. You can barely tell day from night; there seems to be almost no difference here.

        #ASS_MunaInSpaceLowcrawReport = The planet outside the window looks much like home, with rivers, lakes, mountains, plains, and a thick atmosphere. The sight draws you in, and you can hardly wait to settle here. \nThen reality catches up with you: every river and lake is frozen solid.
        #ASS_MunaInSpacecrewReport = It looks cold and lifeless, its surface entirely frozen over.
        #ASS_MunaFlyingcrewReport = Good heavens, there is actually oxygen in its atmosphere!
        #ASS_MunaSrfLandedcrewReport = It is a little cold here. You will need warm clothes outside, but you can hardly wait to go.
        #ASS_MunaInSpaceLowevaReport = The vast world below is beautiful and inviting. You cannot take your eyes off it.
        #ASS_MunaInSpaceevaReport = A white marble.
        #ASS_MunaFlyingevaReport = I think it is time to get back inside the spacecraft.
        #ASS_MunaFlyingLowevaReport = Excited by the beautiful world below, you reach out both hands as though you could touch the white clouds.
        #ASS_MunaevaSrfLanded = It may be cold and deathly quiet now, but you believe conditions will improve once the Sun enters the AGB phase.
        #ASS_MunaFlyingcrewReportYuanqian = You spot an abandoned base nearby. It reminds you of what happened at these same coordinates on Earth more than seven billion years ago.
        #ASS_MunaSrfLandedcrewReportYuanqian = You pick up a radio signal. Its source seems to be nearby.
        #ASS_MunaInSpaceLowevaReportYuanqian = You notice the vast plain below.
        #ASS_MunaFlyingevaReportYuanqian = You notice how empty this plain is, with no trees or grass in sight.
        #ASS_MunaevaSrfLandedYuanqian = You gaze at the endless desert and sigh sadly, standing in silence as a gentle breeze passes by.
        #ASS_MunaevaSrfLandedBeiWanQing_ = That radio signal seems to be getting stronger.
        #ASS_MunaFlyingevaReportBeiWanQing_ = Where are we?
        #ASS_MunaInSpaceevaReportBeiWanQing_ = The coordinates of the plain below keep reminding you of something: "23.125460, 113.264770."
        #ASS_MunaFlyingcrewReportBeiWanQing_ = You receive a landing guidance signal from the surface, requesting that you land at coordinates "23.125460, 113.264770."
        #ASS_MunaSrfLandedcrewReportBeiWanQing_ = Does anything look unusual here?
        #ASS_MunaSrfLandedcrewReport = You peer through the window, searching for fossils.
        #ASS_MunaFlyingcrewReportJiOcean = This frozen ocean looks inviting.
        #ASS_MunaFlyingevaReportJiOcean = You soar above the snow-white sea. Be careful; weather near the ocean can change without warning.
        #ASS_MunaInSpaceLowevaReportJiOcean = Is there life in the ocean below?

        #ASS_MinmausInSpaceLowcrawReport = Your orbit seems unstable. Without corrections, the spacecraft may eventually crash into the world below or be pulled away by the super-Earth's gravity.
        #ASS_MinmausInSpacecrewReport = Its shape looks rather odd. Has it reached hydrostatic equilibrium? \nYou cannot help wondering.
        #ASS_MinmausSrfLandedcrewReport = Looking up through the window, you can clearly see the ring reflecting sunlight.
        #ASS_MinmausInSpaceLowevaReport = A close look at this red world reveals countless craters and many strange scratches across its surface.
        #ASS_MinmausInSpaceevaReport = This little rock looks like a giant meatball.
        #ASS_MinmausSrfLandedevaReport = You look up, searching for the super-Earth and its immense ring. The shadow this moon casts across the ring and the planet below makes you reflect on both the smallness and the greatness of humanity in the universe.
        #ASS_MinmausSrfLandedcrewReportLowlands = Through the window, you see loose rocks scattered across this tiny world, with a rift of unknown origin in the distance.
        #ASS_MinmausInSpaceLowevaReportLowlands = On a world with such weak gravity, mountains can grow exceptionally tall. A small, low-lying patch of ground stands out clearly among the peaks.
        #ASS_MinmausSrfLandedevaReportLowlands = A powerful jump here might carry you higher than that hilltop.

        #ASS_MollInSpaceLowcreawReport = You stare at the gray world outside the window and reassure yourself that you are not color-blind.
        #ASS_MollInSpace = An ancient gray world covered in cracks. You have no idea how they formed.
        #ASS_MollSrfLandedcrewReport = You have landed on this gray world. Through the window, it looks remarkably like the Moon. What a place to stage a fake lunar landing!
        #ASS_MollInSpaceLowevaReport = The gray terrain below is densely covered in craters, which could make landing large spacecraft difficult. \nPerhaps these craters offer a clue to just how ancient this world is.
        #ASS_MollInSpaceevaReport = "Surely you bear no grudge; why, then, are you always full when we are apart? We know joy and sorrow, parting and reunion; the moon is bright or veiled, waxing or waning. Such things have never been perfect. May we live long, sharing the same moonlight though a thousand miles apart."
        #ASS_MollSrfLandedevaReport = Does the ground look a little slippery?
        #ASS_MuollInSpaceLowcrawReport = The vast canyon is by far the most striking feature of the otherwise monotonous world below.
        #ASS_MollInSpacecrewReport = Almost everything is gray. You can barely find a trace of any other color.
        #ASS_MollSrfLandedcrewReport = For some reason, the terrain here seems exceptionally rugged.
        #ASS_MollSrfLandedcrewReportLiegu = The canyon outside the window is strewn with rocks of every size. Could it be an ancient riverbed?


        // Surface samples


        #ASS_MercurySrfSplashed = You're not sure whether lava belongs in a container for solid samples or liquid samples.
        #ASS_MercurysurfaceSample = The surface rock is so soft that you can dig up a piece with almost no effort.
        #ASS_MercurysurfaceSampleEquatorialhotspot = The rock sample churns and boils inside the sample container.
        #ASS_MercurysurfaceSampleLavaFlow = The softened rock below is flowing rapidly downhill.

        #ASS_VenusSrfSplashed = Scalding lava churns inside the sample container.
        #ASS_VenussurfaceSampleSurface = The searing rock keeps giving off vapor, and the sample container seems to be softening.
        #ASS_VenussurfaceSampleBrokenLand = The rock sample from below appears to contain a large amount of sulfur.
        #ASS_VenussurfaceSouthlands = It's cooler here, and the rock hasn't melted completely. You use a pickaxe to collect a relatively soft piece.

        #ASS_EarthsurfaceSamplePanguland = Using radiometric dating, you still detect large deposits of radioactive material in this continent's soil. You also find a few plastic fragments that have yet to decompose.
        #ASS_EarthSrfSplashed = The lava is so hot that it keeps boiling, nearly melting the sample container.
        #ASS_EarthsurfaceSample = The rock here is so soft that you can scoop up a piece without any effort. It seems to be on the verge of turning into a liquid.
        #ASS_EarthsurfaceSampleisland = The rock here is unusually soft, flowing steadily downhill toward the searing lava sea.
        #ASS_EarthsurfaceSampleisland = The rock below flows slowly. It's so hot that it nearly melts your shovel.
        #ASS_EarthsurfaceSampleHightlands = The material beneath you seems a little firmer, but it is still very viscous.
        #ASS_EarthsurfaceSampleswamp = The ground here seems to contain a large amount of radioactive material.
        #ASS_EarthsurfaceSampleNewlands = You notice that the geological layers here appear relatively young.

        #ASS_MoonSrfSplashed = These rocks have become very soft and hot. \nThe material is also too viscous to put in a container for liquid samples.
        #ASS_MoonSurfSampleMoonSea = The rock here is much harder than in other regions and consists mainly of basalt.
        #ASS_MoonSurfSamplehills = You find that the ground here is rich in titanium, iron, aluminum, and other metals.
        #ASS_MoonSurfSamplehillsNanJi = Several clues suggest that water once existed in these geological layers.
        #ASS_MoonSurfSampleHXS = You find a higher concentration of metals in the crater.

        #ASS_MarssurfaceSampleOlympusProMax = You brush aside a thin layer of snow to reveal ancient basalt. The evidence suggests that this volcano is completely extinct.
        #ASS_MarssurfaceSampleOlympus = A thick layer of snow covers the summit. You drill through it and discover strange rocks containing dozens of minerals and numerous trace elements.
        #ASS_MarssurfaceTaerxisiHeightland = You scoop up a handful of sand from beneath your feet. It is extremely dry, with almost no trace of water.
        #ASS_MarssurfaceTaerxisiSwamp_ = The soil is saturated with water. You can clearly see it seeping out of the fertile ground.
        #ASS_MarssurfaceTaerxisiSwamp_ = The yellow sand below is scorching under the Sun. You can feel the heat even through your gloves.
        #ASS_MarssurfaceCanyonsailor = The soil here is very fertile, containing plenty of moisture and organic matter.
        #ASS_MarsSrfSplashedCanyonsailor = The seawater here seems much the same as elsewhere, only cooler.
        #ASS_MarsSrfSplashed = The seawater is pleasantly warm. Holding the sample container feels like holding a cup of warm water.
        #ASS_MarsSrfSplashedMoran_Sea = You collect and analyze a seawater sample. It contains a strange jumble of chemicals, as though countless spacecraft have crashed here.
        #ASS_MarsSrfLandedMoran_Sea = The soil seems as unremarkable as it is anywhere else. We should look elsewhere.
        #ASS_MarsSrfLandedNanJiQuyu = There seems to be no ice beneath the soil here.
        #ASS_MarsSrfLandedBeiJi_Fuice = The seawater here seems to contain a few tiny ice particles.
        #ASS_MarsSrfSplashedBeiJiFuice = You notice a few tiny ice particles in the seawater here.

        #ASS_PhobosSurfSample = You discover that the soil on this giant potato is extremely fine-grained.
        #ASS_PhobosSurfSampleBZJK = The surface soil and rocks in this enormous crater seem quite different from those elsewhere. The rocks appear to contain a large amount of iron.
        #ASS_PhobosSurfSampleNJPD = There is a small amount of ice beneath the soil here.
        #ASS_PhobosSurfSampleZJK = You detect organic compounds in the rocks inside the crater.
        #ASS_PhobosSurfSampleHightlands = Rocks normally buried beneath the soil are exposed here. You collect a few and find traces of iron, nickel, and other metals. There may be more deeper underground.
        #ASS_PhobosSurfSamplehills = This soil contains organic matter and looks quite fertile. Perhaps we could grow something in it?
        #ASS_PhobosSurfSamplePY = You drill deep below the surface to collect a rock sample and discover that this giant boulder is actually a gem in space.
        #ASS_DeimosSurfSample = The soil composition closely resembles that of some C-type asteroids in the asteroid belt.
        #ASS_DeimosSurfSampleBasin = You pick up a crystal glittering in the sunlight, only to discover that it is a piece of ice.
        #ASS_DeimosSurfSampleCraters = The geological layers here appear to contain large amounts of carbon and sulfur.
        #ASS_DeimosSurfSamplehills = You scoop up some soil with your shovel. It looks like ice cream, with gray "chocolate" dotted with "sesame seeds."
        #ASS_DeimosSurfSampleHightLand = Cocoa powder?
        #ASS_DeimosSurfSamplemountains = You detect metals in the ground on this mountain.

        #ASS_CeresSurfSample = The rock grains here are fine and rounded, with no sharp edges.
        #ASS_CeresSurfSampleYSK = You expected this crater to be littered with rocks. Instead, it looks almost empty, apart from a few pebbles just centimeters across.
        #ASS_CeresSurfSampleJD = The rocks are cooler here. If we dig deep enough, we might find some surviving ice.
        #ASS_CeresSurfSampleShanGu = You scoop up a surface sample with a spoon. The crystals in it may be sodium chloride.

        #ASS_VestaSurfSample = The soil is very dry, with little sign of water.
