        #ASS_Tethys_name = Tethys
        #ASS_Tethys_desc = This weathered snowball in space seems scarcely aware that the Sun has changed. The ancient craters remain, and long ravines still cut across the ice. Compare the view with records from hundreds of millions of years ago, and it may be difficult to find any obvious difference. The frozen mountains still stand where they always have, keeping watch over this world's long, quiet past.\n\nThey say Saturn's once broad rings have disappeared. From this moon's orbit, it was always difficult to see the rings spread out, but early observations recorded the shadow they cast across Saturn's clouds in the sunlight. Now even that familiar shadow is gone. Perhaps the ice has not changed at all; only the sky it has watched for countless ages.
