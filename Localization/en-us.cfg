        // Miscellaneous experiments


        #ASS_InfraredTelescope00 = You scan the depths of the solar system with an infrared telescope, searching for mysterious objects hidden in the Oort Cloud or asteroids that might threaten us. \nAlong the way, you discover numerous red and brown dwarfs invisible to the naked eye.
        #ASS_InfraredTelescope01 = You observe the universe with an infrared telescope. Beyond the Oort Cloud and the interstellar dust, the stars appear brighter. Even in infrared, the clearer view reduces interference. \nWhy didn't we notice this object while we were still in the solar system? Perhaps because the star lies far from the ecliptic plane.
        #ASS_SunHighasteroidSample = You collect and analyze a rock sample from an asteroid, identifying it as a C-type asteroid. Despite being composed mainly of rock, it has a very low density.
        #ASS_InfraredTelescope02 = You spot a nearby brown dwarf with very little proper motion. Perhaps it lies close to our solar system.
        #ASS_TycheHighasteroidSample = This is a typical Oort Cloud comet, made almost entirely of ice. \nAfter this flyby of Tyche, it may never return.

        // BEGIN ASS ADDITIONAL INSTRUMENT REPORTS

        // temperatureScan
        #ASS_temperatureScan_Mercury_SrfLanded = The probe is held close to the sun-baked rock, and the reading keeps rising. With no air to carry the heat away, the sunshade looks more reassuring than the scale.
        #ASS_temperatureScan_Mercury_SrfSplashed = Heat from the lava rushes into the probe, sending the trace almost straight upward. You end the measurement before the thermometer becomes part of the sample.
        #ASS_temperatureScan_Mercury_InSpaceLow = The sunlit side of the probe is gaining heat; the reading begins to fall only after entering the planet's shadow. This record tells us how hot the probe is, rather than how hot space is.
        #ASS_temperatureScan_Mercury_InSpaceHigh = Sunlight still bears down on the instrument. Moving farther from Mercury has not given the thermometer the break we had hoped for.
        #ASS_temperatureScan_Mercury_SrfLanded_Biome002 = The shaded probe is much cooler than the sunlit rock. A cold region still needs measuring; its name is no reason to switch off the cooling system.
        #ASS_temperatureScan_Mercury_SrfLanded_Biome004 = Heat from the sunlit equatorial rock keeps warming the probe. You record the time and illumination angle rather than treating one reading as the temperature for the entire day.
        #ASS_temperatureScan__Venus_SrfLanded = The near-surface reading is hundreds of kelvins above freezing, consistent with a reference environment around 800 K. The hot air offers the instrument no relief.
        #ASS_temperatureScan__Venus_SrfSplashed = The reading climbs rapidly as soon as the probe touches lava. The surrounding atmosphere is already so hot that lifting it clear only slows the damage.
        #ASS_temperatureScan__Venus_FlyingLow = The air grows hotter as altitude decreases. The trace offers no promising altitude for opening a window.
        #ASS_temperatureScan__Venus_FlyingHigh = The upper atmosphere is much cooler than the layers below, but temperature still varies with altitude. Combined with the low-altitude data, this record reveals a steep vertical temperature profile.
        #ASS_temperatureScan__Venus_InSpaceLow = Outside the thick atmosphere, the probe exchanges heat differently. Sunlight, radiation from the planet, and the instrument's own remaining heat must now be separated.
        #ASS_temperatureScan__Venus_InSpaceHigh = The thermometer gives different readings in sunlight and shade. It has not discovered warm air surrounding Venus; it is recording its own thermal state.
        #ASS_temperatureScan__Venus_SrfLanded_Biome007 = The summit air is still searing, though cooler than the lowland measurements. The altitude difference belongs in the report, but not in a vacation brochure.
        #ASS_temperatureScan_Earth_SrfLanded = Near the ground, temperatures exceed a thousand kelvins, heating both probe and mount rapidly. It is difficult to reconcile this trace with the weather records of old Earth.
        #ASS_temperatureScan_Earth_SrfSplashed = Lava pours heat into the instrument, and the transmitted numbers almost resemble a countdown. At least no one will mistake this ocean temperature for swimming weather.
        #ASS_temperatureScan_Earth_FlyingLow = The temperature rises steadily during descent. What was once a mild lower atmosphere is now another scorching layer between the surface and the spacecraft.
        #ASS_temperatureScan_Earth_FlyingHigh = The upper atmosphere is far colder than the air near the ground. This enormous contrast explains how the gas outside can be cold while the world below glows with heat.
        #ASS_temperatureScan_Earth_InSpaceLow = Radiation from Earth and sunlight both affect the external probe. Entering shadow does not cool it instantly; it is still shedding heat accumulated earlier.
        #ASS_temperatureScan_Earth_InSpaceHigh = The probe's temperature changes mainly with its exposure to sunlight. You note that this is not the mean temperature of the once-blue planet.
        #ASS_temperatureScan_Earth_SrfLanded_Biome002 = The rocks of Pangaea transfer intense heat to the probe. The continent still has a name, but the range of an old weather-station thermometer would no longer suffice.
        #ASS_temperatureScan_Earth_SrfLanded_Biome015 = Polar illumination differs from that at the equator, yet the measurement remains lethally hot. No comforting winter has been preserved here for the instrument.
        #ASS_temperatureScan_Luna_SrfLanded = Sunlit regolith keeps heating the probe, while the reading in shade falls gradually. Without an atmosphere to moderate temperatures, the two traces must be recorded separately.
        #ASS_temperatureScan_Luna_InSpaceLow = The probe begins shedding heat over the Moon's night side. Its cooling rate depends on stored heat and cannot be used directly as the temperature of the surface below.
        #ASS_temperatureScan_Luna_InSpaceHigh = Neither distant Earth nor the Moon supplies any air for the thermometer to touch. We have measured the instrument's thermal balance; measuring those worlds will require another method.
        #ASS_temperatureScan_Luna_SrfLanded_Biome003 = The dark mare keeps gaining heat in sunlight. You hold the probe in position and record the full warming curve to compare exposed rock with loose regolith.
        #ASS_temperatureScan_Mars_SrfLanded = The reading near the lowlands is around 300 K, though sunlight and terrain still alter local temperatures. The instrument reminds us that this red world is no longer the frigid desert in the old records.
        #ASS_temperatureScan_Mars_SrfSplashed = Once immersed, the probe gives a steadier reading than it did in the air. The seawater stores heat; a brief shadow does not cool it immediately.
        #ASS_temperatureScan_Mars_FlyingLow = Temperature falls with altitude in the lower atmosphere before the profile begins to change between layers. You record the altitude so that readings from different layers are not mixed together.
        #ASS_temperatureScan_Mars_FlyingHigh = The high-altitude temperature profile does not fall continuously; it rises again in the outermost layers. The gas is very thin, so a higher temperature does not imply equally strong heat transfer.
        #ASS_temperatureScan_Mars_InSpaceLow = Crossing the terminator gradually changes the external probe's temperature. You keep this thermal-response record separate from measurements made inside the atmosphere.
        #ASS_temperatureScan_Mars_InSpaceHigh = Beyond the atmosphere, the thermometer responds mainly to sunlight and its own cooling. It can tell us whether the spacecraft is overheating, but not the weather at our doorstep.
        #ASS_temperatureScan_Mars_SrfLanded_Biome002 = The high altitude brings temperatures well below those of the lowlands, and the probe is colder still near the snow. The warm air at the mountain's foot seems very distant.
        #ASS_temperatureScan_Mars_SrfLanded_Biome005 = Temperatures in the deep valley change as the shadows move. You record where the canyon provides shade for comparison with readings from open lowlands.
        #ASS_temperatureScan_Mars_SrfSplashed_Biome059 = Water near the floating ice cools the probe quickly. Some corners of the ocean can still preserve ice; not all of it is as warm as the lower latitudes.
        #ASS_temperatureScan_Deimos_SrfLanded = The loose soil gives different contact temperatures in sunlight and shade. A gentle touch is enough to hold the probe in place; pressing harder might push you off the ground.
        #ASS_temperatureScan_Deimos_InSpaceLow = The probe briefly loses direct sunlight while passing behind this small moon, and its temperature then falls. Its cooling response lasts longer than the narrow shadow itself.
        #ASS_temperatureScan_Deimos_InSpaceHigh = Mars and Deimos recede into the distance, while the instrument still gains heat in sunlight. Moving away from a world does not instantly place it in a freezer.
        #ASS_temperatureScan_Jupiter_FlyingLow = Temperature climbs rapidly again as the craft enters deeper atmospheric layers. Cold conditions near the cloud tops say little about the interior of this gas giant.
        #ASS_temperatureScan_Jupiter_FlyingHigh = After some local fluctuations, temperature rises markedly farther up in the thin upper atmosphere. You also record pressure, so that hotter but sparse gas is not mistaken for an environment that transfers heat like the deep layers.
        #ASS_temperatureScan_Jupiter_InSpaceLow = The instrument repeatedly warms and cools between Jupiter's shadow and sunlight. This orbital report records the probe's thermal response, not a direct temperature measurement of the clouds below.
        #ASS_temperatureScan_Jupiter_InSpaceHigh = The giant planet has shrunk in the view, but the thermometer is still approaching a new thermal balance. You switch off nearby equipment to find how much of the reading comes from the spacecraft itself.
        #ASS_temperatureScan_Io_SrfLanded = The probe records a marked contrast between exposed rock and shade. Local heat sources also demand attention; not every rise in temperature can be blamed on the Sun.
        #ASS_temperatureScan_Io_SrfSplashed = The lava drives the probe toward dangerous temperatures. The measurement is over quickly; recovering the thermometer may require a separate experiment.
        #ASS_temperatureScan_Io_InSpaceLow = The reading changes mainly with illumination. Even with volcanoes erupting below, this contact thermometer is not an orbital thermal imager.
        #ASS_temperatureScan_Io_InSpaceHigh = Io is now far from the probe, but sunlight and residual heat inside the instrument still affect the reading. Waiting patiently helps more than throwing it farther away.
        #ASS_temperatureScan_Io_SrfLanded_Biome001 = Near the lava flow, the probe warms rapidly before it even touches the ground. Radiant heating is already obvious; there is no need to lower the whole instrument into it.
        #ASS_temperatureScan_Europa_SrfLanded = Conditions near the ice remain bitterly cold, in the low hundreds of kelvins. The tenuous atmosphere has not made this a warm shoreline. You record fissure locations alongside the readings to look for differences worth investigating.
        #ASS_temperatureScan_Europa_FlyingLow = The lower profile rises slightly with altitude before turning downward. The gas is extremely tenuous, and the probe needs more time to approach its temperature.
        #ASS_temperatureScan_Europa_FlyingHigh = The thin gas grows colder toward the atmospheric edge, remaining far below water's freezing point. You include the instrument's illumination state so that solar heating is not confused with warming air.
        #ASS_temperatureScan_Europa_InSpaceLow = Jupiter and frozen Europa make a magnificent backdrop, but the thermometer faithfully records only its own temperature. Searching for heat beneath the ice will require a more suitable instrument.
        #ASS_temperatureScan_Europa_InSpaceHigh = The reading continues to change slowly after leaving Europa's vicinity. With no surrounding air, the probe does not reach equilibrium merely because we declare the experiment started.
        #ASS_temperatureScan_Europa_SrfLanded_Biome006 = Shade inside the fissure complicates comparison with sunlit ice. You account for illumination before considering whether heat might be coming from below.
        #ASS_temperatureScan_Ganymede_SrfLanded = The probe cools markedly near the frozen ground, remaining far below water's freezing point. The appearance of an atmosphere does not mean the frozen soil has thawed.
        #ASS_temperatureScan_Ganymede_FlyingLow = Temperature varies gradually through the lower atmosphere, falling again after a warmer layer. Recording altitude alongside it helps outline the structure of this tenuous gas envelope.
        #ASS_temperatureScan_Ganymede_FlyingHigh = Beyond a warmer layer, the temperature gradually falls. Sunlight strongly affects the probe, so time is needed to distinguish changes in the gas from those of the instrument.
        #ASS_temperatureScan_Ganymede_InSpaceLow = The probe enters Ganymede's shadow and gradually cools. Light reflected from the ice must be considered separately from direct sunlight.
        #ASS_temperatureScan_Ganymede_InSpaceHigh = The thermometer is beyond the tenuous atmosphere, and its reading depends more on spacecraft orientation. Turning the sunshade produces a larger change than expected.
        #ASS_temperatureScan_Callisto_SrfLanded = The gas and ice near the ground remain cold, and the reading offers no evidence of widespread melting. Water in the old craters is still frozen here, at least.
        #ASS_temperatureScan_Callisto_FlyingLow = The lower temperature profile rises gently before falling again. You mark the altitude carefully rather than dismissing the inversion as an instrument fault.
        #ASS_temperatureScan_Callisto_FlyingHigh = The thin gas gets colder toward the atmospheric edge, but heat transfer also slows. The thermometer seems to lag behind every change in its surroundings.
        #ASS_temperatureScan_Callisto_InSpaceLow = The probe gains heat in sunlight and loses it in shade. Callisto's great age has no direct bearing on this thermal-response curve.
        #ASS_temperatureScan_Callisto_InSpaceHigh = The frozen world in the distance looks cold, yet sunlight still warms the instrument. You record the contrast as a reminder that scenery does not determine probe temperature.
        #ASS_temperatureScan_Saturn_FlyingLow = Temperature varies between Saturn's atmospheric layers and rises markedly on deeper descent. A cold layer near 134 K is not the temperature of the entire planet.
        #ASS_temperatureScan_Saturn_FlyingHigh = The thin upper atmosphere grows warmer rather than cooling continuously with altitude. You also save pressure data to compare how effectively the different layers transfer heat.
        #ASS_temperatureScan_Saturn_InSpaceLow = Whitening clouds fill the view while the probe warms and cools between sunlight and shadow. Cloud color is no substitute for a measurement inside the atmosphere.
        #ASS_temperatureScan_Saturn_InSpaceHigh = Saturn, without its conspicuous main rings, is still reflected in the instrument casing. The temperature reading depends mainly on whether that casing is in sunlight.
        #ASS_temperatureScan__Mimas_SrfLanded = The probe gives different readings over sunlit rock and in shade. There is no substantial air to smooth out the contrast, so the measurement location needs careful annotation.
        #ASS_temperatureScan__Mimas_InSpaceLow = The thermometer begins cooling slowly when little Mimas blocks the Sun. A brief eclipse affects the instrument, but does not reveal the temperature of the whole surface.
        #ASS_temperatureScan__Mimas_InSpaceHigh = Saturn's moons are scattered in the distance, but the probe still needs time to shed heat. You include the effect of spacecraft waste heat in the calibration record.
